# Quiz: SI Units and Unit Conversions
# DRAFTED WITH CLAUDE FOR YOUR REVIEW (assisted: true). All conversions and distractors checked by computer.
title: 'SI Units and Unit Conversions: Quiz'
description: 'Seven questions on SI units, metric prefixes and dimensional analysis, with explanations.'
level: beginner
access: free
status: review
assisted: true
questions:
  - id: uc-q1
    prompt: 'Which is an SI base unit?'
    choices:
      - 'litre'
      - 'gram'
      - 'kelvin'
      - 'degree Celsius'
    answer: 'kelvin'
    explanation: 'The SI base unit of temperature is the kelvin. The base unit of mass is the kilogram (not the gram); the litre and °C are accepted but not base units.'
    difficulty: easy
  - id: uc-q2
    prompt: 'What is 2.5 km in metres?'
    choices:
      - '0.0025 m'
      - '250 m'
      - '2500 m'
      - '25 000 m'
    answer: '2500 m'
    explanation: '2.5 km × (1000 m / 1 km) = 2500 m (or 2.5 × 10³ m). The km units cancel.'
    difficulty: easy
  - id: uc-q3
    prompt: 'What is 45 mg in grams?'
    choices:
      - '0.045 g'
      - '0.45 g'
      - '4.5 g'
      - '45 000 g'
    answer: '0.045 g'
    explanation: '45 mg × (1 g / 1000 mg) = 0.045 g. The mg units cancel.'
    difficulty: easy
  - id: uc-q4
    prompt: 'How many cubic centimetres are in 1 m³?'
    choices:
      - '100 cm³'
      - '1000 cm³'
      - '10 000 cm³'
      - '1 000 000 cm³'
    answer: '1 000 000 cm³'
    explanation: '1 m = 100 cm, so 1 m³ = (100 cm)³ = 1 000 000 cm³ (10⁶ cm³). The factor must be cubed.'
    difficulty: medium
  - id: uc-q5
    prompt: 'Which setup correctly converts 350 mL to L?'
    choices:
      - '350 mL × (1000 mL / 1 L)'
      - '350 mL × (1 L / 1000 mL)'
      - '350 mL ÷ (1 L / 1000 mL)'
      - '350 mL × (1 L / 100 mL)'
    answer: '350 mL × (1 L / 1000 mL)'
    explanation: 'mL must be in the denominator to cancel, leaving L: 350 mL × (1 L / 1000 mL) = 0.350 L.'
    difficulty: medium
  - id: uc-q6
    prompt: 'A car travels at 72 km/h. What is this in m/s?'
    choices:
      - '20 m/s'
      - '259 m/s'
      - '1.2 m/s'
      - '72 000 m/s'
    answer: '20 m/s'
    explanation: '72 km/h × (1000 m / 1 km) × (1 h / 3600 s) = 20 m/s. Both km and h cancel.'
    difficulty: medium
  - id: uc-q7
    prompt: 'Mercury has a density of 13.6 g/mL. What volume does 68.0 g of mercury occupy?'
    choices:
      - '5.00 mL'
      - '925 mL'
      - '0.200 mL'
      - '54.4 mL'
    answer: '5.00 mL'
    explanation: '68.0 g × (1 mL / 13.6 g) = 5.00 mL. The density is flipped so that g cancels.'
    difficulty: hard
