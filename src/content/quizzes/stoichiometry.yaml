# Quiz: Stoichiometry
# DRAFTED WITH CLAUDE FOR YOUR REVIEW (assisted: true). All answers checked by computer.
# `answer` must be copied EXACTLY from one of the choices.
# Atomic masses used: H 1.008, C 12.01, N 14.01, O 16.00, Fe 55.85

title: 'Stoichiometry: Quiz'
description: 'Seven questions on mole ratios and mass calculations from balanced equations, with explanations.'
level: intermediate
access: free
status: review
assisted: true

questions:
  - id: st-q1
    prompt: 'In $\ce{2H2 + O2 -> 2H2O}$, what is the mole ratio of $\ce{O2}$ to $\ce{H2O}$?'
    choices:
      - '1 : 1'
      - '1 : 2'
      - '2 : 1'
      - '16 : 18'
    answer: '1 : 2'
    explanation: 'The coefficients are 1 for $\ce{O2}$ and 2 for $\ce{H2O}$, so 1 mol of oxygen gives 2 mol of water. The answer 16 : 18 mixes up masses with moles.'
    difficulty: easy

  - id: st-q2
    prompt: 'In $\ce{N2 + 3H2 -> 2NH3}$, how many moles of $\ce{NH3}$ form from 3.0 mol of $\ce{H2}$ (with enough $\ce{N2}$)?'
    choices:
      - '2.0 mol'
      - '3.0 mol'
      - '4.5 mol'
      - '6.0 mol'
    answer: '2.0 mol'
    explanation: 'Mole ratio = want ÷ have = 2/3. So $3.0 \times \dfrac{2}{3} = 2.0$ mol. The answer 4.5 mol uses the ratio upside down (3/2).'
    difficulty: easy

  - id: st-q3
    prompt: 'Propane burns as $\ce{C3H8 + 5O2 -> 3CO2 + 4H2O}$. How many moles of $\ce{O2}$ are needed to burn 2.00 mol of propane?'
    choices:
      - '0.400 mol'
      - '2.50 mol'
      - '5.00 mol'
      - '10.0 mol'
    answer: '10.0 mol'
    explanation: '$2.00 \times \dfrac{5}{1} = 10.0$ mol of $\ce{O2}$. The answer 0.400 mol divides by 5 instead of multiplying.'
    difficulty: easy

  - id: st-q4
    prompt: 'Using the same equation, what mass of $\ce{CO2}$ forms when 1.00 mol of propane burns completely? ($M(\ce{CO2})$ = 44.01 g/mol)'
    choices:
      - '44.0 g'
      - '88.0 g'
      - '132 g'
      - '220 g'
    answer: '132 g'
    explanation: '1.00 mol of propane gives 3.00 mol of $\ce{CO2}$ (ratio 3/1). Mass = $3.00 \times 44.01 = 132$ g.'
    difficulty: medium

  - id: st-q5
    prompt: 'What mass of ammonia forms from 28.0 g of nitrogen with excess hydrogen? $\ce{N2 + 3H2 -> 2NH3}$ (N = 14.01, H = 1.008)'
    choices:
      - '17.0 g'
      - '28.0 g'
      - '34.0 g'
      - '56.0 g'
    answer: '34.0 g'
    explanation: 'Moles of $\ce{N2}$ = 28.0 ÷ 28.02 = 0.9993 mol. Moles of $\ce{NH3}$ = 0.9993 × 2 = 1.999 mol. Mass = 1.999 × 17.03 = 34.0 g. The answer 28.0 g wrongly assumes the masses are equal.'
    difficulty: medium

  - id: st-q6
    prompt: 'In $\ce{4Fe + 3O2 -> 2Fe2O3}$, how many moles of $\ce{Fe2O3}$ form from 6.00 mol of iron?'
    choices:
      - '3.00 mol'
      - '4.50 mol'
      - '6.00 mol'
      - '12.0 mol'
    answer: '3.00 mol'
    explanation: 'Mole ratio = want ÷ have = 2/4. So $6.00 \times \dfrac{2}{4} = 3.00$ mol of $\ce{Fe2O3}$.'
    difficulty: medium

  - id: st-q7
    prompt: 'A student uses the coefficients in $\ce{2H2 + O2 -> 2H2O}$ to say that 2 g of hydrogen reacts with 1 g of oxygen. What is wrong?'
    choices:
      - 'Nothing; the coefficients give the mass ratio'
      - 'The coefficients give a mole ratio, not a mass ratio'
      - 'The equation is not balanced'
      - 'Hydrogen and oxygen do not react'
    answer: 'The coefficients give a mole ratio, not a mass ratio'
    explanation: 'Coefficients compare numbers of particles (moles). 2 mol of $\ce{H2}$ (4.03 g) reacts with 1 mol of $\ce{O2}$ (32.00 g), so the mass ratio is very different from 2 : 1.'
    difficulty: hard
