# Quiz: Formula Mass and Percent Composition
# DRAFTED WITH CLAUDE FOR YOUR REVIEW (assisted: true). All answers checked by computer.
# `answer` must be copied EXACTLY from one of the choices.
# Atomic masses used: H 1.008, C 12.01, N 14.01, O 16.00, Ca 40.08, Fe 55.85

title: 'Percent Composition: Quiz'
description: 'Seven questions on formula mass and percent composition, with explanations.'
level: beginner
access: free
status: review
assisted: true

questions:
  - id: pc-q1
    prompt: 'What is the formula mass of calcium hydroxide, $\ce{Ca(OH)2}$? (Ca = 40.08, O = 16.00, H = 1.008)'
    choices:
      - '57.09 u'
      - '58.10 u'
      - '74.10 u'
      - '148.19 u'
    answer: '74.10 u'
    explanation: 'The subscript 2 after the parentheses applies to both O and H: $40.08 + 2(16.00 + 1.008) = 74.10$ u. The answer 58.10 u doubles only the H.'
    difficulty: easy

  - id: pc-q2
    prompt: 'What is the mass percent of oxygen in water, $\ce{H2O}$?'
    choices:
      - '11.19%'
      - '33.3%'
      - '50.0%'
      - '88.81%'
    answer: '88.81%'
    explanation: '$\dfrac{16.00}{18.016} \times 100\% = 88.81\%$. The answer 33.3% is the fraction of *atoms* that are oxygen (1 of 3), not the fraction of the mass.'
    difficulty: easy

  - id: pc-q3
    prompt: 'What is the mass percent of carbon in carbon dioxide, $\ce{CO2}$?'
    choices:
      - '12.01%'
      - '27.29%'
      - '33.3%'
      - '72.71%'
    answer: '27.29%'
    explanation: 'Formula mass = 12.01 + 2(16.00) = 44.01 u. % C = $\dfrac{12.01}{44.01} \times 100\% = 27.29\%$. The answer 72.71% is the percentage of oxygen.'
    difficulty: medium

  - id: pc-q4
    prompt: 'What is the mass percent of nitrogen in ammonia, $\ce{NH3}$?'
    choices:
      - '14.01%'
      - '17.75%'
      - '25.0%'
      - '82.25%'
    answer: '82.25%'
    explanation: 'Formula mass = 14.01 + 3(1.008) = 17.034 u. % N = $\dfrac{14.01}{17.034} \times 100\% = 82.25\%$. The answer 25.0% counts atoms (1 of 4) instead of mass.'
    difficulty: medium

  - id: pc-q5
    prompt: 'What mass of iron is in 50.0 g of iron(III) oxide, $\ce{Fe2O3}$? (Fe = 55.85, O = 16.00)'
    choices:
      - '17.5 g'
      - '35.0 g'
      - '50.0 g'
      - '69.9 g'
    answer: '35.0 g'
    explanation: 'Formula mass = 2(55.85) + 3(16.00) = 159.70 u. Mass of Fe = $\dfrac{111.70}{159.70} \times 50.0\ \text{g} = 35.0$ g. The answer 17.5 g forgets that there are two Fe atoms in the formula.'
    difficulty: hard

  - id: pc-q6
    prompt: 'Sample A is 1.00 g of pure water and sample B is 1.00 kg of pure water. How do their mass percents of hydrogen compare?'
    choices:
      - 'They are the same'
      - 'Sample B has a higher percentage'
      - 'Sample A has a higher percentage'
      - 'It depends on the temperature'
    answer: 'They are the same'
    explanation: 'A pure compound always has the same composition by mass. Both samples are 11.19% hydrogen; only the total mass is different.'
    difficulty: easy

  - id: pc-q7
    prompt: 'What is the mass percent of calcium in calcium carbonate, $\ce{CaCO3}$? (Ca = 40.08, C = 12.01, O = 16.00)'
    choices:
      - '12.00%'
      - '20.0%'
      - '40.04%'
      - '47.96%'
    answer: '40.04%'
    explanation: 'Formula mass = 40.08 + 12.01 + 3(16.00) = 100.09 u. % Ca = $\dfrac{40.08}{100.09} \times 100\% = 40.04\%$. The answer 20.0% counts atoms (1 of 5).'
    difficulty: medium
