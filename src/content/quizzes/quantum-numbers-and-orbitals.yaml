# Quiz: Quantum Numbers and Orbitals
# DRAFTED WITH CLAUDE FOR YOUR REVIEW (assisted: true). All answers and distractors checked.
title: 'Quantum Numbers and Orbitals: Quiz'
description: 'Seven questions on quantum numbers, allowed sets, counting orbitals and electrons, and orbital shapes, with explanations.'
level: intermediate
access: free
status: published
assisted: true
questions:
  - id: qn-q1
    prompt: 'Which quantum number mainly describes the shape of an orbital?'
    choices:
      - 'n'
      - 'l'
      - 'mₗ'
      - 'mₛ'
    answer: 'l'
    explanation: 'The angular momentum quantum number l sets the shape: s (l = 0) spherical, p (l = 1) two lobes, d (l = 2) mostly four lobes.'
    difficulty: easy
  - id: qn-q2
    prompt: 'How many orbitals are in a d subshell?'
    choices:
      - '1'
      - '3'
      - '5'
      - '10'
    answer: '5'
    explanation: 'For d, l = 2, so mₗ = −2, −1, 0, +1, +2: five orbitals. 10 is the maximum number of electrons.'
    difficulty: easy
  - id: qn-q3
    prompt: 'Which subshell does not exist?'
    choices:
      - '2s'
      - '2d'
      - '3p'
      - '4f'
    answer: '2d'
    explanation: 'For n = 2, l can only be 0 or 1 (s or p). The first d subshell is 3d.'
    difficulty: easy
  - id: qn-q4
    prompt: 'What is the maximum number of electrons in the n = 4 shell?'
    choices:
      - '8'
      - '16'
      - '18'
      - '32'
    answer: '32'
    explanation: 'Shell n holds 2n² electrons: 2 × 4² = 32 (4s 2 + 4p 6 + 4d 10 + 4f 14). 16 is the number of orbitals.'
    difficulty: medium
  - id: qn-q5
    prompt: 'Which set of quantum numbers (n, l, mₗ, mₛ) is allowed?'
    choices:
      - '(3, 1, −2, +½)'
      - '(3, 3, 0, −½)'
      - '(3, 2, −1, +½)'
      - '(0, 0, 0, +½)'
    answer: '(3, 2, −1, +½)'
    explanation: 'For n = 3, l can be 2, and mₗ = −1 lies between −2 and +2. (3, 1, −2) has |mₗ| > l; (3, 3) has l = n; n cannot be 0.'
    difficulty: medium
  - id: qn-q6
    prompt: 'Which subshell has n = 4 and l = 1?'
    choices:
      - '4s'
      - '4p'
      - '4d'
      - '1p'
    answer: '4p'
    explanation: 'l = 1 is a p subshell, and n = 4 is the shell: 4p, with 3 orbitals and up to 6 electrons.'
    difficulty: medium
  - id: qn-q7
    prompt: 'How many radial nodes does a 4s orbital have?'
    choices:
      - '0'
      - '1'
      - '3'
      - '4'
    answer: '3'
    explanation: 'Radial nodes = n − l − 1 = 4 − 0 − 1 = 3. An s orbital has no angular nodes (l = 0), so all n − 1 = 3 nodes are radial.'
    difficulty: hard
