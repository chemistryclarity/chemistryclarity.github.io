# Quiz: Empirical and Molecular Formulas
# DRAFTED WITH CLAUDE FOR YOUR REVIEW (assisted: true). All answers checked by computer.
# `answer` must be copied EXACTLY from one of the choices.
# Atomic masses used: H 1.008, C 12.01, N 14.01, O 16.00

title: 'Empirical Formulas: Quiz'
description: 'Seven questions on empirical and molecular formulas, with explanations.'
level: intermediate
access: free
status: review
assisted: true

questions:
  - id: ef-q1
    prompt: 'What is the empirical formula of glucose, $\ce{C6H12O6}$?'
    choices:
      - '$\ce{C6H12O6}$'
      - '$\ce{C2H4O2}$'
      - '$\ce{CH2O}$'
      - '$\ce{CHO}$'
    answer: '$\ce{CH2O}$'
    explanation: 'Divide every subscript by the largest common factor, 6: $\ce{C6H12O6}$ → $\ce{CH2O}$. $\ce{C2H4O2}$ has the right ratio but is not the *simplest* one.'
    difficulty: easy

  - id: ef-q2
    prompt: 'Which of these formulas is already an empirical formula?'
    choices:
      - '$\ce{C2H6}$'
      - '$\ce{N2O4}$'
      - '$\ce{CO2}$'
      - '$\ce{C4H10}$'
    answer: '$\ce{CO2}$'
    explanation: 'In $\ce{CO2}$ the ratio 1 : 2 cannot be simplified. The others can: $\ce{C2H6}$ → $\ce{CH3}$, $\ce{N2O4}$ → $\ce{NO2}$, $\ce{C4H10}$ → $\ce{C2H5}$.'
    difficulty: easy

  - id: ef-q3
    prompt: 'After dividing by the smallest number of moles, you get Fe : O = 1 : 1.50. What is the empirical formula?'
    choices:
      - '$\ce{FeO}$'
      - '$\ce{FeO2}$'
      - '$\ce{Fe2O3}$'
      - '$\ce{Fe3O2}$'
    answer: '$\ce{Fe2O3}$'
    explanation: 'A ratio ending in .5 must be multiplied by 2: 1 : 1.50 becomes 2 : 3, so $\ce{Fe2O3}$. Rounding 1.5 up to 2 would give the wrong formula, $\ce{FeO2}$.'
    difficulty: medium

  - id: ef-q4
    prompt: 'A compound is 74.87% C and 25.13% H by mass. What is its empirical formula?'
    choices:
      - '$\ce{CH}$'
      - '$\ce{CH3}$'
      - '$\ce{CH4}$'
      - '$\ce{C3H}$'
    answer: '$\ce{CH4}$'
    explanation: 'Moles in 100 g: C = 74.87 ÷ 12.01 = 6.234; H = 25.13 ÷ 1.008 = 24.93. Divide by 6.234: C = 1.00, H = 4.00, so $\ce{CH4}$. The answer $\ce{C3H}$ comes from using the percentages directly instead of moles.'
    difficulty: medium

  - id: ef-q5
    prompt: 'A compound has empirical formula $\ce{CH2}$ and molar mass 42.08 g/mol. What is its molecular formula?'
    choices:
      - '$\ce{CH2}$'
      - '$\ce{C2H4}$'
      - '$\ce{C3H6}$'
      - '$\ce{C6H12}$'
    answer: '$\ce{C3H6}$'
    explanation: 'Empirical formula mass = 12.01 + 2(1.008) = 14.03 g/mol. $n = 42.08 \div 14.03 = 3.00$, so the molecular formula is $\ce{C3H6}$.'
    difficulty: medium

  - id: ef-q6
    prompt: 'Benzene has empirical formula $\ce{CH}$ and molar mass 78.11 g/mol. What is its molecular formula?'
    choices:
      - '$\ce{C2H2}$'
      - '$\ce{C4H4}$'
      - '$\ce{C6H6}$'
      - '$\ce{C8H8}$'
    answer: '$\ce{C6H6}$'
    explanation: 'Empirical formula mass = 12.01 + 1.008 = 13.02 g/mol. $n = 78.11 \div 13.02 = 6.00$, so $\ce{C6H6}$.'
    difficulty: medium

  - id: ef-q7
    prompt: 'Why do you divide every mole value by the smallest one?'
    choices:
      - 'To convert grams into moles'
      - 'To make the smallest value 1 and find the ratio between elements'
      - 'To find the molar mass of the compound'
      - 'To turn the ratio into percentages'
    answer: 'To make the smallest value 1 and find the ratio between elements'
    explanation: 'Dividing by the smallest value scales the numbers so the smallest becomes exactly 1. The others then show how many atoms of each element there are for every one atom of that element.'
    difficulty: easy
