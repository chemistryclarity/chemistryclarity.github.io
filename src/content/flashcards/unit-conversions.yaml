# Flashcards: SI Units and Unit Conversions
# DRAFTED WITH CLAUDE FOR YOUR REVIEW (assisted: true). All conversions checked by computer.
title: 'SI Units and Unit Conversions: Flashcards'
description: 'Revise the SI base units, metric prefixes and converting units with conversion factors.'
level: beginner
access: free
status: review
assisted: true
cards:
  - id: uc-01
    front: 'What is the SI base unit of mass?'
    back: 'The kilogram, kg.'
  - id: uc-02
    front: 'Name the SI base units for length, time, temperature and amount of substance.'
    back: 'metre (m), second (s), kelvin (K), mole (mol)'
  - id: uc-03
    front: 'What does the prefix milli (m) mean?'
    back: '$10^{-3}$: 1 mL = 0.001 L'
  - id: uc-04
    front: 'What does the prefix micro (μ) mean?'
    back: '$10^{-6}$: 1 μg = $10^{-6}$ g'
  - id: uc-05
    front: 'What is a conversion factor?'
    back: 'A fraction equal to 1, made from an equality, e.g. $\dfrac{1000\ \text{m}}{1\ \text{km}}$.'
  - id: uc-06
    front: 'How many cm³ are in 1 mL?'
    back: '1 cm³ (1 mL = 1 cm³)'
  - id: uc-07
    front: 'How many cm² are in 1 m²?'
    back: '$10^{4}$ cm², because (100 cm)² = 10 000 cm²'
  - id: uc-08
    front: 'Convert 350 mL to L.'
    back: '350 mL × (1 L / 1000 mL) = 0.350 L'
  - id: uc-09
    front: 'Convert 72 km/h to m/s.'
    back: '72 km/h × (1000 m / 1 km) × (1 h / 3600 s) = 20 m/s'
  - id: uc-10
    front: 'How do you know a conversion factor is the right way up?'
    back: 'The unit you want to remove must cancel: it goes in the denominator of the factor.'
