# Flashcards: Temperature Scales
# DRAFTED WITH CLAUDE FOR YOUR REVIEW (assisted: true). All conversions checked by computer.
title: 'Temperature Scales: Flashcards'
description: 'Revise converting between °C, °F and K, reference temperatures and where Celsius equals Fahrenheit.'
level: beginner
access: free
status: review
assisted: true
cards:
  - id: ts-01
    front: 'How do you convert °C to °F?'
    back: 'Multiply by 9/5 (1.8), then add 32: $T_\text{F} = \tfrac{9}{5}T_\text{C} + 32$'
  - id: ts-02
    front: 'How do you convert °F to °C?'
    back: 'Subtract 32, then multiply by 5/9: $T_\text{C} = \tfrac{5}{9}(T_\text{F} - 32)$'
  - id: ts-03
    front: 'How do you convert °C to K?'
    back: 'Add 273.15: $T_\text{K} = T_\text{C} + 273.15$'
  - id: ts-04
    front: 'At what temperature are the Celsius and Fahrenheit readings equal?'
    back: '−40: −40 °C = −40 °F'
  - id: ts-05
    front: 'What are the freezing and boiling points of water (1 atm) in °C, °F and K?'
    back: 'Freezing: 0 °C = 32 °F = 273.15 K. Boiling: 100 °C = 212 °F = 373.15 K.'
  - id: ts-06
    front: 'What is absolute zero in K, °C and °F?'
    back: '0 K = −273.15 °C = −459.67 °F'
  - id: ts-07
    front: 'Convert 25 °C to °F.'
    back: '(9 °F/5 °C)(25 °C) + 32 °F = 77 °F'
  - id: ts-08
    front: 'Why is the factor 9/5?'
    back: 'Between freezing and boiling water there are 180 °F but only 100 °C: 180/100 = 9/5.'
  - id: ts-09
    front: 'A temperature rises by 10 °C. What is the rise in K and in °F?'
    back: '10 K and 18 °F (no offset for changes).'
  - id: ts-10
    front: 'Is it correct to write 300 °K?'
    back: 'No. Kelvin has no degree sign: write 300 K.'
