<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .num { fill: #5b6577; font-size: 10px; }
    .ax { fill: #14213d; font-size: 11px; font-weight: 600; }
    .axis { stroke: #8a94a6; stroke-width: 1.3; fill: none; }
    .grid { stroke: #e3e7ee; stroke-width: 1; }
    .lnA { stroke: #0f766e; stroke-width: 2.4; fill: none; } .lnB { stroke: #b45309; stroke-width: 2.4; fill: none; }
    .pA { fill: #0f766e; } .pB { fill: #b45309; }
    .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .oAtom { fill: #dc2626; } .hAtom { fill: #e5e7eb; stroke: #8a94a6; stroke-width: 1; } .bond { stroke: #14213d; stroke-width: 2.4; }
    .hb { stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 4 3; } .hbl { fill: #2563eb; font-size: 10.5px; font-weight: 700; }
    .dm { fill: #dc2626; font-size: 10px; font-weight: 700; } .dp { fill: #2563eb; font-size: 10px; font-weight: 700; }
    .oT { fill: #ffffff; font-size: 10px; font-weight: 700; } .hT { fill: #14213d; font-size: 9px; font-weight: 700; }
    .src { fill: #b45309; } .ray { stroke: #b45309; stroke-width: 1; stroke-dasharray: 3 3; fill: none; opacity: 0.8; }
    .cell { fill: #fde7c7; stroke: #b45309; stroke-width: 1; }
    .det { fill: #d9dee7; stroke: #5b6577; stroke-width: 1; } .body { fill: #f6f8fb; stroke: #8a94a6; stroke-width: 1.4; }
    .gam { stroke: #7c3aed; stroke-width: 2.4; fill: none; marker-end: url(#hC); } .hC { fill: #7c3aed; }
    .pos { fill: #0f766e; } .ele { fill: #2563eb; } .short { stroke: #0f766e; stroke-width: 1.6; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .lab, .ax, .hT { fill: #e9edf5; } .sub, .num { fill: #9aa5ba; }
      .axis { stroke: #6b7894; } .grid { stroke: #2a3550; }
      .lnA { stroke: #2dd4bf; } .pA, .lA, .pos { fill: #2dd4bf; } .lnB { stroke: #fbbf24; } .pB, .lB, .src { fill: #fbbf24; }
      .lC, .hC { fill: #c4b5fd; } .gam { stroke: #c4b5fd; }
      .oAtom { fill: #f87171; } .hAtom { fill: #3a4763; stroke: #9aa5ba; } .bond { stroke: #e9edf5; }
      .hb { stroke: #60a5fa; } .hbl, .dp, .ele { fill: #60a5fa; } .dm { fill: #f87171; }
      .ray { stroke: #fbbf24; } .cell { fill: #4a3410; stroke: #fbbf24; } .short { stroke: #2dd4bf; }
      .det { fill: #3a4763; stroke: #9aa5ba; } .body { fill: #1b263d; stroke: #6b7894; }
    }
  </style>
  <defs><marker id="hC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hC" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="384" rx="14"/><text class="t" x="20" y="28">Solubility and temperature</text><text class="sub" x="20" y="45">Grams of solid that dissolve in 100 g of water (approximate).</text><line class="grid" x1="56" y1="286" x2="330" y2="286"/><text class="num" x="50" y="289.5" text-anchor="end">0</text><line class="grid" x1="56" y1="242.8" x2="330" y2="242.8"/><text class="num" x="50" y="246.3" text-anchor="end">50</text><line class="grid" x1="56" y1="199.6" x2="330" y2="199.6"/><text class="num" x="50" y="203.1" text-anchor="end">100</text><line class="grid" x1="56" y1="156.4" x2="330" y2="156.4"/><text class="num" x="50" y="159.9" text-anchor="end">150</text><line class="grid" x1="56" y1="113.19999999999999" x2="330" y2="113.19999999999999"/><text class="num" x="50" y="116.69999999999999" text-anchor="end">200</text><line class="grid" x1="56" y1="70" x2="330" y2="70"/><text class="num" x="50" y="73.5" text-anchor="end">250</text><text class="num" x="56" y="301" text-anchor="middle">0</text><text class="num" x="110.80000000000001" y="301" text-anchor="middle">20</text><text class="num" x="165.60000000000002" y="301" text-anchor="middle">40</text><text class="num" x="220.4" y="301" text-anchor="middle">60</text><text class="num" x="275.20000000000005" y="301" text-anchor="middle">80</text><text class="num" x="330" y="301" text-anchor="middle">100</text><path class="axis" d="M56 64 V286 H334"/><text class="ax" x="193" y="318" text-anchor="middle">temperature (°C)</text><text class="ax" transform="translate(16 178) rotate(-90)" text-anchor="middle">g per 100 g water</text><path class="lnA" d="M56 274.5088 C65.1 271.9, 92.5 266.0, 110.8 258.7 C129.1 251.4, 147.3 242.1, 165.6 230.8 C183.9 219.5, 202.1 206.1, 220.4 191.0 C238.7 175.8, 256.9 159.6, 275.2 140.0 C293.5 120.4, 320.9 84.5, 330.0 73.5"/><path class="lnB" d="M56 255.1552 C65.1 255.1, 92.5 255.0, 110.8 254.9 C129.1 254.8, 147.3 254.6, 165.6 254.4 C183.9 254.2, 202.1 254.0, 220.4 253.8 C238.7 253.5, 256.9 253.1, 275.2 252.8 C293.5 252.5, 320.9 252.2, 330.0 252.1"/><circle class="pA" cx="56" cy="274.5088" r="3.4"/><circle class="pA" cx="110.80000000000001" cy="258.6976" r="3.4"/><circle class="pA" cx="165.60000000000002" cy="230.7904" r="3.4"/><circle class="pA" cx="220.4" cy="190.95999999999998" r="3.4"/><circle class="pA" cx="275.20000000000005" cy="139.98399999999998" r="3.4"/><circle class="pA" cx="330" cy="73.45600000000002" r="3.4"/><circle class="pB" cx="56" cy="255.1552" r="3.4"/><circle class="pB" cx="110.80000000000001" cy="254.89600000000002" r="3.4"/><circle class="pB" cx="165.60000000000002" cy="254.3776" r="3.4"/><circle class="pB" cx="220.4" cy="253.77280000000002" r="3.4"/><circle class="pB" cx="275.20000000000005" cy="252.82240000000002" r="3.4"/><circle class="pB" cx="330" cy="252.13119999999998" r="3.4"/><text class="lA" x="236.84" y="147.76">potassium nitrate</text><text class="lB" x="209.44000000000003" y="241.072">sodium chloride</text><text class="sub" x="20" y="356">KNO₃ dissolves far more when hot; NaCl hardly changes.</text><text class="sub" x="20" y="371">Gases do the opposite: they dissolve less when hot.</text>
</svg>
