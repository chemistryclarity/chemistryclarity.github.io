<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 700; }
    .a { fill: #fca5a5; stroke: #dc2626; stroke-width: 1.2; }
    .b { fill: #93c5fd; stroke: #2563eb; stroke-width: 1.2; }
    .c { fill: #86efac; stroke: #16a34a; stroke-width: 1.2; }
    .d { fill: #fde68a; stroke: #b45309; stroke-width: 1.2; }
    .l { fill: #14213d; font-size: 9px; font-weight: 800; }
    .op { fill: #5b6577; font-size: 13px; font-weight: 700; }
    .row { stroke: #e5e1d6; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab { fill: #e9edf5; }
      .sub, .op { fill: #9aa5ba; }
      .a { fill: #7f1d1d; stroke: #f87171; }
      .b { fill: #1e3a8a; stroke: #93c5fd; }
      .c { fill: #14532d; stroke: #86efac; }
      .d { fill: #713f12; stroke: #fde68a; }
      .l { fill: #e9edf5; }
      .row { stroke: #2a3550; }
    }
  </style>
  <rect class="bg" width="360" height="300" rx="14"/>
  <text class="t" x="16" y="28">Four reaction patterns</text>
  <text class="sub" x="16" y="45">Each ball is an element or group of atoms.</text>

  <!-- helpers: ball r=10; letters inside -->
  <!-- Row 1: synthesis y=80 -->
  <text class="lab" x="16" y="72">Synthesis</text>
  <g transform="translate(0 88)">
    <circle class="a" cx="130" cy="0" r="10"/><text class="l" x="130" y="3" text-anchor="middle">A</text>
    <text class="op" x="152" y="5" text-anchor="middle">+</text>
    <circle class="b" cx="174" cy="0" r="10"/><text class="l" x="174" y="3" text-anchor="middle">B</text>
    <text class="op" x="206" y="5" text-anchor="middle">→</text>
    <circle class="a" cx="238" cy="0" r="10"/><text class="l" x="238" y="3" text-anchor="middle">A</text>
    <circle class="b" cx="257" cy="0" r="10"/><text class="l" x="257" y="3" text-anchor="middle">B</text>
  </g>
  <line class="row" x1="16" y1="112" x2="344" y2="112"/>

  <!-- Row 2: decomposition -->
  <text class="lab" x="16" y="136">Decomposition</text>
  <g transform="translate(0 152)">
    <circle class="a" cx="130" cy="0" r="10"/><text class="l" x="130" y="3" text-anchor="middle">A</text>
    <circle class="b" cx="149" cy="0" r="10"/><text class="l" x="149" y="3" text-anchor="middle">B</text>
    <text class="op" x="206" y="5" text-anchor="middle">→</text>
    <circle class="a" cx="238" cy="0" r="10"/><text class="l" x="238" y="3" text-anchor="middle">A</text>
    <text class="op" x="260" y="5" text-anchor="middle">+</text>
    <circle class="b" cx="282" cy="0" r="10"/><text class="l" x="282" y="3" text-anchor="middle">B</text>
  </g>
  <line class="row" x1="16" y1="176" x2="344" y2="176"/>

  <!-- Row 3: single displacement -->
  <text class="lab" x="16" y="200">Single displacement</text>
  <g transform="translate(0 216)">
    <circle class="a" cx="40" cy="0" r="10"/><text class="l" x="40" y="3" text-anchor="middle">A</text>
    <text class="op" x="62" y="5" text-anchor="middle">+</text>
    <circle class="b" cx="84" cy="0" r="10"/><text class="l" x="84" y="3" text-anchor="middle">B</text>
    <circle class="c" cx="103" cy="0" r="10"/><text class="l" x="103" y="3" text-anchor="middle">C</text>
    <text class="op" x="140" y="5" text-anchor="middle">→</text>
    <circle class="a" cx="176" cy="0" r="10"/><text class="l" x="176" y="3" text-anchor="middle">A</text>
    <circle class="c" cx="195" cy="0" r="10"/><text class="l" x="195" y="3" text-anchor="middle">C</text>
    <text class="op" x="217" y="5" text-anchor="middle">+</text>
    <circle class="b" cx="239" cy="0" r="10"/><text class="l" x="239" y="3" text-anchor="middle">B</text>
  </g>
  <line class="row" x1="16" y1="240" x2="344" y2="240"/>

  <!-- Row 4: double displacement -->
  <text class="lab" x="16" y="264">Double displacement</text>
  <g transform="translate(0 280)">
    <circle class="a" cx="30" cy="0" r="10"/><text class="l" x="30" y="3" text-anchor="middle">A</text>
    <circle class="b" cx="49" cy="0" r="10"/><text class="l" x="49" y="3" text-anchor="middle">B</text>
    <text class="op" x="71" y="5" text-anchor="middle">+</text>
    <circle class="c" cx="93" cy="0" r="10"/><text class="l" x="93" y="3" text-anchor="middle">C</text>
    <circle class="d" cx="112" cy="0" r="10"/><text class="l" x="112" y="3" text-anchor="middle">D</text>
    <text class="op" x="146" y="5" text-anchor="middle">→</text>
    <circle class="a" cx="180" cy="0" r="10"/><text class="l" x="180" y="3" text-anchor="middle">A</text>
    <circle class="d" cx="199" cy="0" r="10"/><text class="l" x="199" y="3" text-anchor="middle">D</text>
    <text class="op" x="221" y="5" text-anchor="middle">+</text>
    <circle class="c" cx="243" cy="0" r="10"/><text class="l" x="243" y="3" text-anchor="middle">C</text>
    <circle class="b" cx="262" cy="0" r="10"/><text class="l" x="262" y="3" text-anchor="middle">B</text>
  </g>
</svg>
