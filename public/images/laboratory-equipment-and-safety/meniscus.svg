<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .glass { fill: none; stroke: #5b6577; stroke-width: 2; }
    .liq { fill: #cfe8fb; }
    .men { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .tick { stroke: #3d4657; stroke-width: 1.2; }
    .tick2 { stroke: #8a94a6; stroke-width: 1; }
    .num { fill: #14213d; font-size: 10.5px; font-weight: 600; }
    .ok { stroke: #0f766e; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }
    .bad { stroke: #b91c1c; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .okt { fill: #0f766e; font-size: 11px; font-weight: 700; }
    .badt { fill: #b91c1c; font-size: 10.5px; font-weight: 700; }
    .eye { fill: #ffffff; stroke: #14213d; stroke-width: 1.5; }
    .pupil { fill: #14213d; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .num { fill: #e9edf5; }
      .sub { fill: #9aa5ba; }
      .glass { stroke: #9aa5ba; }
      .liq { fill: #1e3a5f; }
      .men { stroke: #60a5fa; }
      .tick { stroke: #c7cfdd; }
      .tick2 { stroke: #6b7894; }
      .ok { stroke: #2dd4bf; }
      .okt { fill: #2dd4bf; }
      .bad { stroke: #f87171; }
      .badt { fill: #f87171; }
      .eye { fill: #1b263d; stroke: #e9edf5; }
      .pupil { fill: #e9edf5; }
    }
  </style>
  <rect class="bg" width="360" height="300" rx="14"/>
  <text class="t" x="20" y="28">Reading a burette</text>
  <text class="sub" x="20" y="45">Bottom of the meniscus, eye level with it.</text>

  <!-- liquid below meniscus; scale 0.1 mL = 40 px, 23.1 at y=90 -->
  <path class="liq" d="M176 183 Q196 197 216 183 V290 H176 Z"/>
  <path class="men" d="M176 183 Q196 197 216 183"/>
  <path class="glass" d="M176 60 V290 M216 60 V290"/>

  <g class="tick">
    <line x1="216" y1="90" x2="236" y2="90"/><line x1="216" y1="130" x2="236" y2="130"/>
    <line x1="216" y1="170" x2="236" y2="170"/><line x1="216" y1="250" x2="236" y2="250"/>
    <line x1="216" y1="210" x2="236" y2="210"/>
  </g>
  <text class="num" x="240" y="94">23.1</text>
  <text class="num" x="240" y="134">23.2</text>
  <text class="num" x="240" y="174">23.3</text>
  <text class="num" x="240" y="214">23.4</text>
  <text class="num" x="240" y="254">23.5</text>

  <!-- correct eye: level with bottom of meniscus (y=209) -->
  <ellipse class="eye" cx="40" cy="190" rx="13" ry="8"/><circle class="pupil" cx="45" cy="190" r="3.5"/>
  <line class="ok" x1="56" y1="190" x2="196" y2="190"/>
  <text class="okt" x="58" y="182">✓ 23.35 mL</text>

  <!-- eye above -->
  <ellipse class="eye" cx="40" cy="100" rx="13" ry="8"/><circle class="pupil" cx="45" cy="102" r="3.5"/>
  <line class="bad" x1="56" y1="104" x2="196" y2="190"/>
  <text class="badt" x="20" y="84">✗ eye above: parallax</text>

  <!-- eye below -->
  <ellipse class="eye" cx="40" cy="282" rx="13" ry="8"/><circle class="pupil" cx="45" cy="280" r="3.5"/>
  <line class="bad" x1="56" y1="277" x2="196" y2="190"/>
  <text class="badt" x="62" y="296">✗ eye below</text>
</svg>
