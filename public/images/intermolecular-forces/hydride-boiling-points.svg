<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .num { fill: #5b6577; font-size: 10px; }
    .ax { fill: #14213d; font-size: 11px; font-weight: 600; }
    .axis { stroke: #8a94a6; stroke-width: 1.3; fill: none; }
    .grid { stroke: #e3e7ee; stroke-width: 1; }
    .lnA { stroke: #0f766e; stroke-width: 2.4; fill: none; } .lnB { stroke: #b45309; stroke-width: 2.4; fill: none; }
    .pA { fill: #0f766e; } .pB { fill: #b45309; }
    .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .oAtom { fill: #dc2626; } .hAtom { fill: #e5e7eb; stroke: #8a94a6; stroke-width: 1; } .bond { stroke: #14213d; stroke-width: 2.4; }
    .hb { stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 4 3; } .hbl { fill: #2563eb; font-size: 10.5px; font-weight: 700; }
    .dm { fill: #dc2626; font-size: 10px; font-weight: 700; } .dp { fill: #2563eb; font-size: 10px; font-weight: 700; }
    .oT { fill: #ffffff; font-size: 10px; font-weight: 700; } .hT { fill: #14213d; font-size: 9px; font-weight: 700; }
    .src { fill: #b45309; } .ray { stroke: #b45309; stroke-width: 1; stroke-dasharray: 3 3; fill: none; opacity: 0.8; }
    .cell { fill: #fde7c7; stroke: #b45309; stroke-width: 1; }
    .det { fill: #d9dee7; stroke: #5b6577; stroke-width: 1; } .body { fill: #f6f8fb; stroke: #8a94a6; stroke-width: 1.4; }
    .gam { stroke: #7c3aed; stroke-width: 2.4; fill: none; marker-end: url(#hC); } .hC { fill: #7c3aed; }
    .pos { fill: #0f766e; } .ele { fill: #2563eb; } .short { stroke: #0f766e; stroke-width: 1.6; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .lab, .ax, .hT { fill: #e9edf5; } .sub, .num { fill: #9aa5ba; }
      .axis { stroke: #6b7894; } .grid { stroke: #2a3550; }
      .lnA { stroke: #2dd4bf; } .pA, .lA, .pos { fill: #2dd4bf; } .lnB { stroke: #fbbf24; } .pB, .lB, .src { fill: #fbbf24; }
      .lC, .hC { fill: #c4b5fd; } .gam { stroke: #c4b5fd; }
      .oAtom { fill: #f87171; } .hAtom { fill: #3a4763; stroke: #9aa5ba; } .bond { stroke: #e9edf5; }
      .hb { stroke: #60a5fa; } .hbl, .dp, .ele { fill: #60a5fa; } .dm { fill: #f87171; }
      .ray { stroke: #fbbf24; } .cell { fill: #4a3410; stroke: #fbbf24; } .short { stroke: #2dd4bf; }
      .det { fill: #3a4763; stroke: #9aa5ba; } .body { fill: #1b263d; stroke: #6b7894; }
    }
  </style>
  <defs><marker id="hC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hC" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="380" rx="14"/><text class="t" x="20" y="28">Boiling points of the hydrides</text><text class="sub" x="20" y="45">Water is far higher than the trend predicts: hydrogen bonding.</text><line class="grid" x1="56" y1="300" x2="330" y2="300"/><text class="num" x="50" y="303.5" text-anchor="end">−180</text><line class="grid" x1="56" y1="254" x2="330" y2="254"/><text class="num" x="50" y="257.5" text-anchor="end">−120</text><line class="grid" x1="56" y1="208" x2="330" y2="208"/><text class="num" x="50" y="211.5" text-anchor="end">−60</text><line class="grid" x1="56" y1="162" x2="330" y2="162"/><text class="num" x="50" y="165.5" text-anchor="end">0</text><line class="grid" x1="56" y1="116" x2="330" y2="116"/><text class="num" x="50" y="119.5" text-anchor="end">60</text><line class="grid" x1="56" y1="70" x2="330" y2="70"/><text class="num" x="50" y="73.5" text-anchor="end">120</text><text class="num" x="76" y="315" text-anchor="middle">2</text><text class="num" x="154" y="315" text-anchor="middle">3</text><text class="num" x="232" y="315" text-anchor="middle">4</text><text class="num" x="310" y="315" text-anchor="middle">5</text><path class="axis" d="M56 64 V300 H334"/><text class="ax" x="193" y="332" text-anchor="middle">period</text><text class="ax" transform="translate(16 185) rotate(-90)" text-anchor="middle">boiling point (°C)</text><path class="lnA" d="M76.0 286.2 L154.0 247.9 L232.0 229.5 L310.0 201.9"/><path class="lnB" d="M76.0 85.3 L154.0 208.0 L232.0 193.4 L310.0 163.5"/><circle class="pA" cx="76" cy="286.2" r="4"/><text class="lA" x="82" y="301.2">CH₄</text><circle class="pA" cx="154" cy="247.86666666666667" r="4"/><text class="lA" x="160" y="262.8666666666667">SiH₄</text><circle class="pA" cx="232" cy="229.46666666666667" r="4"/><text class="lA" x="238" y="244.46666666666667">GeH₄</text><circle class="pA" cx="310" cy="201.86666666666667" r="4"/><text class="lA" x="316" y="216.86666666666667">SnH₄</text><circle class="pB" cx="76" cy="85.33333333333334" r="4"/><text class="lB" x="84" y="76.33333333333334" text-anchor="start">H₂O</text><circle class="pB" cx="154" cy="208" r="4"/><text class="lB" x="154" y="199" text-anchor="middle">H₂S</text><circle class="pB" cx="232" cy="193.43333333333334" r="4"/><text class="lB" x="232" y="184.43333333333334" text-anchor="middle">H₂Se</text><circle class="pB" cx="310" cy="163.53333333333333" r="4"/><text class="lB" x="310" y="154.53333333333333" text-anchor="middle">H₂Te</text><text class="lB" x="84" y="91.33333333333334">100 °C</text><text class="lB" x="200.8" y="131.33333333333334">group 16</text><text class="lA" x="200.8" y="269.3333333333333">group 14</text><text class="sub" x="20" y="366">Extending the trend, water would boil at about −80 °C.</text>
</svg>
