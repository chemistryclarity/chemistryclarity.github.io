<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .small { fill: #14213d; font-size: 10.5px; font-weight: 600; }
    .num { fill: #5b6577; font-size: 10px; }
    .ax { fill: #14213d; font-size: 11px; font-weight: 600; }
    .axis { stroke: #8a94a6; stroke-width: 1.3; fill: none; }
    .grid { stroke: #e3e7ee; stroke-width: 1; } .zero { stroke: #5b6577; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .lnA { stroke: #0f766e; stroke-width: 2.4; fill: none; } .lnB { stroke: #b45309; stroke-width: 2.4; fill: none; } .lnC { stroke: #7c3aed; stroke-width: 2.4; fill: none; }
    .pA { fill: #0f766e; } .pB { fill: #b45309; } .pC { fill: #7c3aed; }
    .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .shadeG { fill: #0f766e; opacity: 0.07; } .shadeR { fill: #b45309; opacity: 0.07; }
    .ok { fill: #0f766e; font-size: 11px; font-weight: 700; } .bad { fill: #be123c; font-size: 11px; font-weight: 700; }
    .beaker { fill: none; stroke: #8a94a6; stroke-width: 1.8; } .sol { fill: #e6eef5; }
    .elec { fill: #5b6577; } .wire { stroke: #14213d; stroke-width: 2; fill: none; }
    .batt { fill: #ffffff; stroke: #14213d; stroke-width: 1.8; } .bub { fill: none; stroke: #5b6577; stroke-width: 1; }
    .ion { fill: #14213d; font-size: 10.5px; font-weight: 700; }
    .arrE { stroke: #7c3aed; stroke-width: 2; fill: none; marker-end: url(#hC); } .hC { fill: #7c3aed; }
    .arrI { stroke: #5b6577; stroke-width: 1.4; fill: none; marker-end: url(#hD); } .hD { fill: #5b6577; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .lab, .ax, .small, .ion { fill: #e9edf5; } .sub, .num { fill: #9aa5ba; }
      .axis { stroke: #6b7894; } .grid { stroke: #2a3550; } .zero { stroke: #9aa5ba; }
      .lnA { stroke: #2dd4bf; } .pA, .lA, .ok { fill: #2dd4bf; } .lnB { stroke: #fbbf24; } .pB, .lB { fill: #fbbf24; }
      .lnC { stroke: #c4b5fd; } .pC, .lC, .hC { fill: #c4b5fd; } .arrE { stroke: #c4b5fd; } .bad { fill: #fb7185; }
      .shadeG { fill: #2dd4bf; } .shadeR { fill: #fbbf24; }
      .beaker { stroke: #6b7894; } .sol { fill: #1b2a40; } .elec { fill: #9aa5ba; } .wire { stroke: #e9edf5; }
      .batt { fill: #151e31; stroke: #e9edf5; } .bub { stroke: #9aa5ba; } .arrI { stroke: #9aa5ba; } .hD { fill: #9aa5ba; }
    }
  </style>
  <defs><marker id="hC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hC" d="M0 0 10 5 0 10z"/></marker><marker id="hD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hD" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="400" rx="14"/><text class="t" x="20" y="28">ΔG° = ΔH° − TΔS° changes with T</text><text class="sub" x="20" y="45">Below the dashed line (ΔG° negative) the reaction is spontaneous.</text><line class="grid" x1="58" y1="310" x2="330" y2="310"/><text class="num" x="52" y="313.5" text-anchor="end">−150</text><line class="grid" x1="58" y1="280" x2="330" y2="280"/><text class="num" x="52" y="283.5" text-anchor="end">−100</text><line class="grid" x1="58" y1="250" x2="330" y2="250"/><text class="num" x="52" y="253.5" text-anchor="end">−50</text><line class="grid" x1="58" y1="220" x2="330" y2="220"/><text class="num" x="52" y="223.5" text-anchor="end">0</text><line class="grid" x1="58" y1="190" x2="330" y2="190"/><text class="num" x="52" y="193.5" text-anchor="end">50</text><line class="grid" x1="58" y1="160" x2="330" y2="160"/><text class="num" x="52" y="163.5" text-anchor="end">100</text><line class="grid" x1="58" y1="130" x2="330" y2="130"/><text class="num" x="52" y="133.5" text-anchor="end">150</text><line class="grid" x1="58" y1="100" x2="330" y2="100"/><text class="num" x="52" y="103.5" text-anchor="end">200</text><line class="grid" x1="58" y1="70" x2="330" y2="70"/><text class="num" x="52" y="73.5" text-anchor="end">250</text><text class="num" x="58" y="325" text-anchor="middle">0</text><text class="num" x="96.85714285714286" y="325" text-anchor="middle">200</text><text class="num" x="135.71428571428572" y="325" text-anchor="middle">400</text><text class="num" x="174.57142857142856" y="325" text-anchor="middle">600</text><text class="num" x="213.42857142857142" y="325" text-anchor="middle">800</text><text class="num" x="252.28571428571428" y="325" text-anchor="middle">1000</text><text class="num" x="291.1428571428571" y="325" text-anchor="middle">1200</text><text class="num" x="330" y="325" text-anchor="middle">1400</text><rect class="shadeG" x="58" y="220" width="272" height="90"/><path class="axis" d="M58 64 V310 H334"/><line class="zero" x1="58" y1="220" x2="330" y2="220"/><path class="lnA" d="M58 275.08 L330 108.67600000000004"/><path class="lnB" d="M58 112.48000000000002 L330 247.048"/><circle class="pA" cx="147.95428571428573" cy="220" r="4.5"/><circle class="pB" cx="275.4057142857143" cy="220" r="4.5"/><text class="lA" x="141.95428571428573" y="210" text-anchor="end">463 K</text><text class="lB" x="269.4057142857143" y="238" text-anchor="end">1119 K</text><text class="lA" x="149.3142857142857" y="266.8">N₂ + 3H₂ → 2NH₃</text><text class="num" x="149.3142857142857" y="279.8">ΔH° &lt; 0, ΔS° &lt; 0: spontaneous when cool</text><text class="lB" x="66" y="77.20000000000002">CaCO₃ → CaO + CO₂</text><text class="num" x="66" y="90.20000000000002">ΔH° &gt; 0, ΔS° &gt; 0: spontaneous when hot</text><text class="ok" x="326" y="302" text-anchor="end">spontaneous</text><text class="ax" x="194" y="342" text-anchor="middle">temperature, T (K)</text><text class="ax" transform="translate(16 190) rotate(-90)" text-anchor="middle">ΔG° (kJ)</text><text class="sub" x="20" y="388">Crossing point: T = ΔH° ÷ ΔS°.</text>
</svg>
