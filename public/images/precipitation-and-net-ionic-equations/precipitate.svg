<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .glass { fill: none; stroke: #5b6577; stroke-width: 2; }
    .water { fill: #e0f2fe; }
    .cat { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.2; }
    .an { fill: #fde68a; stroke: #b45309; stroke-width: 1.2; }
    .an2 { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1.2; }
    .spec { fill: #ddd6fe; stroke: #7c3aed; stroke-width: 1.2; }
    .it { fill: #14213d; font-size: 6.6px; font-weight: 800; }
    .lab { fill: #14213d; font-size: 11px; font-weight: 700; }
    .ex { fill: #5b6577; font-size: 9.5px; }
    .op { fill: #5b6577; font-size: 16px; font-weight: 700; }
    .arr { stroke: #5b6577; stroke-width: 2.2; fill: none; }
    .ah { fill: #5b6577; }
    .ppt { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
    .eq { fill: #14213d; font-size: 13px; font-weight: 700; }
    .note { fill: #5b6577; font-size: 10.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab, .it, .eq { fill: #e9edf5; }
      .sub, .ex, .op, .note { fill: #9aa5ba; }
      .glass { stroke: #9aa5ba; }
      .water { fill: #1e3a5f; }
      .cat { fill: #374151; stroke: #d1d5db; }
      .an { fill: #713f12; stroke: #fde68a; }
      .an2 { fill: #14532d; stroke: #86efac; }
      .spec { fill: #3b2f6b; stroke: #c4b5fd; }
      .arr { stroke: #9aa5ba; } .ah { fill: #9aa5ba; }
      .ppt { fill: #e2e8f0; stroke: #f8fafc; }
    }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="300" rx="14"/>
  <text class="t" x="16" y="28">A precipitation reaction</text>
  <text class="sub" x="16" y="45">Mixing two solutions of ionic compounds</text>
  <path class="water" d="M23 98 H107 V167 H23 Z"/><path class="glass" d="M20 70 V170 H110 V70"/><circle class="cat" cx="40" cy="115" r="9"/><text class="it" x="40" y="118" text-anchor="middle">Ag⁺</text><circle class="cat" cx="85" cy="140" r="9"/><text class="it" x="85" y="143" text-anchor="middle">Ag⁺</text><circle class="an" cx="70" cy="110" r="9"/><text class="it" x="70" y="113" text-anchor="middle">NO₃⁻</text><circle class="an" cx="42" cy="150" r="9"/><text class="it" x="42" y="153" text-anchor="middle">NO₃⁻</text><text class="lab" x="65" y="190" text-anchor="middle">AgNO₃(aq)</text><text class="op" x="125" y="125" text-anchor="middle">+</text><path class="water" d="M143 98 H227 V167 H143 Z"/><path class="glass" d="M140 70 V170 H230 V70"/><circle class="spec" cx="160" cy="112" r="9"/><text class="it" x="160" y="115" text-anchor="middle">Na⁺</text><circle class="spec" cx="205" cy="145" r="9"/><text class="it" x="205" y="148" text-anchor="middle">Na⁺</text><circle class="an2" cx="195" cy="108" r="9"/><text class="it" x="195" y="111" text-anchor="middle">Cl⁻</text><circle class="an2" cx="162" cy="150" r="9"/><text class="it" x="162" y="153" text-anchor="middle">Cl⁻</text><text class="lab" x="185" y="190" text-anchor="middle">NaCl(aq)</text><path class="arr" d="M240 120 H262" marker-end="url(#ah)"/><path class="water" d="M273 88 H345 V177 H273 Z"/><path class="glass" d="M270 60 V180 H348 V60"/><circle class="spec" cx="286" cy="110" r="9"/><text class="it" x="286" y="113" text-anchor="middle">Na⁺</text><circle class="an" cx="330" cy="100" r="9"/><text class="it" x="330" y="103" text-anchor="middle">NO₃⁻</text><circle class="spec" cx="316" cy="132" r="9"/><text class="it" x="316" y="135" text-anchor="middle">Na⁺</text><circle class="an" cx="288" cy="140" r="9"/><text class="it" x="288" y="143" text-anchor="middle">NO₃⁻</text><path class="ppt" d="M274 176 Q290 160 309 166 Q326 158 344 176 Z"/><text class="lab" x="346" y="200" text-anchor="end">AgCl(s) forms</text><text class="ex" x="346" y="214" text-anchor="end">Na⁺, NO₃⁻ stay dissolved</text>
  <text class="eq" x="180" y="252" text-anchor="middle">Net ionic: Ag⁺(aq) + Cl⁻(aq) → AgCl(s)</text>
  <text class="note" x="180" y="272" text-anchor="middle">Spectator ions (Na⁺, NO₃⁻) are left out.</text>
</svg>
