<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .pt { fill: #14213d; font-size: 12.5px; font-weight: 700; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .num { fill: #5b6577; font-size: 10.5px; }
    .axis { stroke: #8a94a6; stroke-width: 1.3; }
    .tick { stroke: #8a94a6; stroke-width: 1.3; }
    .dotA { fill: #0f766e; } .dotB { fill: #b45309; }
    .up { stroke: #0f766e; stroke-width: 2.6; fill: none; marker-end: url(#hdA); } .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; }
    .down { stroke: #b45309; stroke-width: 2.6; fill: none; marker-end: url(#hdB); } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; }
    .el { stroke: #7c3aed; stroke-width: 2.2; fill: none; marker-end: url(#hdC); stroke-dasharray: 5 3; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .hdA { fill: #0f766e; } .hdB { fill: #b45309; } .hdC { fill: #7c3aed; } .hd { fill: #14213d; }
    .beaker { fill: none; stroke: #8a94a6; stroke-width: 1.8; }
    .solA { fill: #e6eef5; } .solB { fill: #cfe0f7; }
    .zn { fill: #9aa5ba; stroke: #5b6577; stroke-width: 1.2; } .cu { fill: #c2703d; stroke: #8a4a22; stroke-width: 1.2; }
    .wire { stroke: #14213d; stroke-width: 2; fill: none; }
    .meter { fill: #ffffff; stroke: #14213d; stroke-width: 1.8; }
    .bridge { fill: none; stroke: #c9c5b8; stroke-width: 14; stroke-linejoin: round; }
    .bridgeIn { fill: none; stroke: #f3f1ea; stroke-width: 10; stroke-linejoin: round; }
    .ion { fill: #5b6577; font-size: 10px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .pt, .lab { fill: #e9edf5; } .sub, .num, .ion { fill: #9aa5ba; }
      .axis, .tick { stroke: #6b7894; }
      .dotA, .hdA, .lA { fill: #2dd4bf; } .up { stroke: #2dd4bf; }
      .dotB, .hdB, .lB { fill: #fbbf24; } .down { stroke: #fbbf24; }
      .el { stroke: #c4b5fd; } .hdC, .lC { fill: #c4b5fd; } .hd { fill: #e9edf5; }
      .beaker { stroke: #6b7894; } .solA { fill: #1b2a40; } .solB { fill: #1e3354; }
      .wire { stroke: #e9edf5; } .meter { fill: #151e31; stroke: #e9edf5; }
      .bridge { stroke: #3a4763; } .bridgeIn { stroke: #1b263d; }
    }
  </style>
  <defs>
    <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hd" d="M0 0 10 5 0 10z"/></marker><marker id="hdA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hdA" d="M0 0 10 5 0 10z"/></marker><marker id="hdB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hdB" d="M0 0 10 5 0 10z"/></marker><marker id="hdC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hdC" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="bg" width="360" height="400" rx="14"/>
  <text class="t" x="20" y="28">Oxidation and reduction: Zn + Cu²⁺</text>
  <text class="sub" x="20" y="45">Oxidation numbers change as electrons move from Zn to Cu²⁺.</text>
  <line class="axis" x1="90" y1="286" x2="90" y2="96"/><line class="tick" x1="85" y1="286" x2="95" y2="286"/><text class="num" x="81" y="289.5" text-anchor="end">−1</text><line class="tick" x1="85" y1="238.5" x2="95" y2="238.5"/><text class="num" x="81" y="242" text-anchor="end">0</text><line class="tick" x1="85" y1="191" x2="95" y2="191"/><text class="num" x="81" y="194.5" text-anchor="end">+1</text><line class="tick" x1="85" y1="143.5" x2="95" y2="143.5"/><text class="num" x="81" y="147" text-anchor="end">+2</text><line class="tick" x1="85" y1="96" x2="95" y2="96"/><text class="num" x="81" y="99.5" text-anchor="end">+3</text><text class="pt" x="90" y="78" text-anchor="middle">zinc</text>
  <line class="axis" x1="250" y1="286" x2="250" y2="96"/><line class="tick" x1="245" y1="286" x2="255" y2="286"/><text class="num" x="241" y="289.5" text-anchor="end">−1</text><line class="tick" x1="245" y1="238.5" x2="255" y2="238.5"/><text class="num" x="241" y="242" text-anchor="end">0</text><line class="tick" x1="245" y1="191" x2="255" y2="191"/><text class="num" x="241" y="194.5" text-anchor="end">+1</text><line class="tick" x1="245" y1="143.5" x2="255" y2="143.5"/><text class="num" x="241" y="147" text-anchor="end">+2</text><line class="tick" x1="245" y1="96" x2="255" y2="96"/><text class="num" x="241" y="99.5" text-anchor="end">+3</text><text class="pt" x="250" y="78" text-anchor="middle">copper</text>
  <circle class="dotA" cx="90" cy="238.5" r="5"/><circle class="dotA" cx="90" cy="143.5" r="5"/>
  <path class="up" d="M104 234.5 C 130 210, 130 172, 104 149.5"/>
  <text class="lab" x="70" y="256.5" text-anchor="end">Zn</text><text class="lab" x="70" y="133.5" text-anchor="end">Zn²⁺</text>
  <text class="lA" x="132" y="185">oxidation</text><text class="lA" x="132" y="200">0 → +2</text>
  <circle class="dotB" cx="250" cy="143.5" r="5"/><circle class="dotB" cx="250" cy="238.5" r="5"/>
  <path class="down" d="M264 147.5 C 290 172, 290 210, 264 232.5"/>
  <text class="lab" x="230" y="133.5" text-anchor="end">Cu²⁺</text><text class="lab" x="230" y="256.5" text-anchor="end">Cu</text>
  <text class="lB" x="292" y="185">reduction</text><text class="lB" x="292" y="200">+2 → 0</text>
  <path class="el" d="M110 267 H232"/>
  <text class="lC" x="171" y="260" text-anchor="middle">2 e⁻</text>
  <text class="lab" x="20" y="322">Zn → Zn²⁺ + 2e⁻ (oxidation: electrons lost)</text>
  <text class="lab" x="20" y="340">Cu²⁺ + 2e⁻ → Cu (reduction: electrons gained)</text>
  <text class="sub" x="20" y="364">Zn is the reducing agent; Cu²⁺ is the oxidizing agent.</text>
  <text class="sub" x="20" y="380">Electrons lost = electrons gained (2 e⁻).</text>
</svg>
