<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f3f1ea; stroke: #c9c5b8; stroke-width: 1.5; }
    .mol { fill: #e6f4f1; stroke: #0f766e; stroke-width: 2.5; }
    .t { fill: #14213d; font-size: 15px; font-weight: 700; }
    .m { fill: #0f766e; font-size: 15px; font-weight: 750; }
    .sub { fill: #5b6577; font-size: 11.5px; }
    .op { fill: #14213d; font-size: 12.5px; font-weight: 650; }
    .bridge { fill: #7c3aed; font-size: 12.5px; font-weight: 700; }
    .arrow { stroke: #14213d; stroke-width: 2; fill: none; marker-end: url(#hd); }
    .barrow { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#hdb); }
    .hd { fill: #14213d; }
    .hdb { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .box { fill: #1b263d; stroke: #3a4763; }
      .mol { fill: #123a3a; stroke: #2dd4bf; }
      .t, .op { fill: #e9edf5; }
      .m { fill: #2dd4bf; }
      .sub { fill: #9aa5ba; }
      .bridge { fill: #c4b5fd; }
      .arrow { stroke: #e9edf5; }
      .barrow { stroke: #c4b5fd; }
      .hd { fill: #e9edf5; }
      .hdb { fill: #c4b5fd; }
    }
  </style>
  <defs>
    <marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0 10 5 0 10z"/></marker>
    <marker id="hdb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hdb" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="bg" width="360" height="520" rx="14"/>

  <text class="sub" x="180" y="26" text-anchor="middle">You know substance A. You want substance B.</text>

  <rect class="box" x="70" y="40" width="220" height="50" rx="10"/>
  <text class="t" x="180" y="62" text-anchor="middle">Grams of A</text>
  <text class="sub" x="180" y="80" text-anchor="middle">what you measure</text>
  <path class="arrow" d="M180 92 V146"/>
  <text class="op" x="190" y="118">÷ molar mass of A</text>

  <rect class="mol" x="70" y="150" width="220" height="50" rx="10"/>
  <text class="m" x="180" y="180" text-anchor="middle">Moles of A</text>

  <path class="barrow" d="M180 202 V286"/>
  <text class="bridge" x="190" y="230">× mole ratio</text>
  <text class="sub" x="190" y="247">B ÷ A, from the</text>
  <text class="sub" x="190" y="262">balanced equation</text>

  <rect class="mol" x="70" y="290" width="220" height="50" rx="10"/>
  <text class="m" x="180" y="320" text-anchor="middle">Moles of B</text>
  <path class="arrow" d="M180 342 V396"/>
  <text class="op" x="190" y="368">× molar mass of B</text>

  <rect class="box" x="70" y="400" width="220" height="50" rx="10"/>
  <text class="t" x="180" y="422" text-anchor="middle">Grams of B</text>
  <text class="sub" x="180" y="440" text-anchor="middle">what you want</text>

  <text class="sub" x="180" y="482" text-anchor="middle">The equation connects moles to moles only.</text>
  <text class="sub" x="180" y="499" text-anchor="middle">Never go straight from grams to grams.</text>
</svg>
