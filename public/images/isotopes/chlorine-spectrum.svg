<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .axis { stroke: #14213d; stroke-width: 1.5; fill: none; }
    .grid { stroke: #e3e0d6; stroke-width: 1; }
    .bar35 { fill: #0f766e; }
    .bar37 { fill: #7c3aed; }
    .num { fill: #14213d; font-size: 11px; }
    .val { fill: #14213d; font-size: 12px; font-weight: 700; }
    .lbl { fill: #14213d; font-size: 12px; font-weight: 650; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .num, .val, .lbl { fill: #e9edf5; }
      .sub { fill: #9aa5ba; }
      .axis { stroke: #e9edf5; }
      .grid { stroke: #27324a; }
      .bar35 { fill: #2dd4bf; }
      .bar37 { fill: #c4b5fd; }
    }
  </style>
  <rect class="bg" width="360" height="340" rx="14"/>
  <text class="t" x="20" y="30">Simplified mass spectrum of chlorine</text>
  <text class="sub" x="20" y="47">Relative abundance of each isotope (%)</text>

  <!-- plot area: x 60..330, y 70..250 (0% at y=250, 100% at y=70) -->
  <line class="grid" x1="60" y1="70" x2="330" y2="70"/>
  <line class="grid" x1="60" y1="115" x2="330" y2="115"/>
  <line class="grid" x1="60" y1="160" x2="330" y2="160"/>
  <line class="grid" x1="60" y1="205" x2="330" y2="205"/>
  <text class="num" x="52" y="74" text-anchor="end">100</text>
  <text class="num" x="52" y="119" text-anchor="end">75</text>
  <text class="num" x="52" y="164" text-anchor="end">50</text>
  <text class="num" x="52" y="209" text-anchor="end">25</text>
  <text class="num" x="52" y="254" text-anchor="end">0</text>

  <!-- bars: height = abundance × 1.8 -->
  <rect class="bar35" x="110" y="113.6" width="44" height="136.4"/>
  <text class="val" x="132" y="106" text-anchor="middle">75.76%</text>
  <rect class="bar37" x="236" y="206.4" width="44" height="43.6"/>
  <text class="val" x="258" y="199" text-anchor="middle">24.24%</text>

  <path class="axis" d="M60 66 V250 H332"/>
  <text class="lbl" x="132" y="270" text-anchor="middle">chlorine-35</text>
  <text class="lbl" x="258" y="270" text-anchor="middle">chlorine-37</text>
  <text class="sub" x="195" y="290" text-anchor="middle">Mass (u): 34.969 and 36.966</text>

  <text class="sub" x="20" y="316">Weighted average: 35.45 u, the value on the</text>
  <text class="sub" x="20" y="331">periodic table. It is closer to 35 than to 37.</text>
</svg>
