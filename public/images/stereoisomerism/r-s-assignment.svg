<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .bond { stroke: #14213d; stroke-width: 2; fill: none; }
    .hash { stroke: #14213d; stroke-width: 5; stroke-dasharray: 1.5 2.2; }
    .at { fill: #14213d; font-size: 11px; font-weight: 800; }
    .p1 { fill: #dc2626; font-size: 10px; font-weight: 800; } .p2 { fill: #2563eb; font-size: 10px; font-weight: 800; }
    .p3 { fill: #16a34a; font-size: 10px; font-weight: 800; } .p4 { fill: #6b7280; font-size: 10px; font-weight: 800; }
    .badge { fill: #ffffff; stroke-width: 1.4; }
    .b1 { stroke: #dc2626; } .b2 { stroke: #2563eb; } .b3 { stroke: #16a34a; } .b4 { stroke: #6b7280; }
    .arc { stroke: #7c3aed; stroke-width: 2.2; fill: none; }
    .ah { fill: #7c3aed; }
    .res { fill: #6d28d9; font-size: 12.5px; font-weight: 800; }
    .cbg { fill: #ffffff; }
    .mir { stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .step { fill: #3d4657; font-size: 10.3px; }
    .stepn { fill: #14213d; font-size: 10.3px; font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .at, .stepn { fill: #e9edf5; }
      .sub { fill: #9aa5ba; } .step { fill: #c7cfdd; }
      .bond { stroke: #e9edf5; } .hash { stroke: #e9edf5; }
      .badge { fill: #151e31; }
      .p1 { fill: #fca5a5; } .p2 { fill: #93c5fd; } .p3 { fill: #86efac; } .p4 { fill: #cbd5e1; }
      .b1 { stroke: #fca5a5; } .b2 { stroke: #93c5fd; } .b3 { stroke: #86efac; } .b4 { stroke: #cbd5e1; }
      .arc { stroke: #c4b5fd; } .ah { fill: #c4b5fd; } .res { fill: #c4b5fd; }
      .mir { stroke: #6b7894; } .cbg { fill: #151e31; }
    }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="330" rx="14"/>
  <text class="t" x="16" y="28">Assigning R and S: butan-2-ol</text>
  <text class="sub" x="16" y="45">Priorities: OH (1) · CH₂CH₃ (2) · CH₃ (3) · H (4)</text>
  <line class="mir" x1="180" y1="58" x2="180" y2="244"/>

  <!-- LEFT: (R). centre (90,138); OH up, C2H5 lower right, CH3 lower left, H back (hashed, up-right small) -->
  <g>
    <line class="bond" x1="90" y1="138" x2="90" y2="96"/>
    <line class="bond" x1="90" y1="138" x2="128" y2="160"/>
    <line class="bond" x1="90" y1="138" x2="52" y2="160"/>
    <line class="hash" x1="92" y1="136" x2="104" y2="118"/>
    <circle class="cbg" cx="90" cy="138" r="7.5"/><text class="at" x="90" y="142" text-anchor="middle">C</text>
    <text class="p1" x="90" y="90" text-anchor="middle">OH</text>
    <text class="p2" x="132" y="172" text-anchor="start">C₂H₅</text>
    <text class="p3" x="48" y="172" text-anchor="end">CH₃</text>
    <text class="p4" x="108" y="115">H</text>
    <circle class="badge b1" cx="72" cy="94" r="7"/><text class="p1" x="72" y="97.5" text-anchor="middle">1</text>
    <circle class="badge b2" cx="140" cy="150" r="7"/><text class="p2" x="140" y="153.5" text-anchor="middle">2</text>
    <circle class="badge b3" cx="40" cy="150" r="7"/><text class="p3" x="40" y="153.5" text-anchor="middle">3</text>
    <!-- clockwise arc: from top (1) to lower right (2) to lower left (3) -->
    <path class="arc" d="M116 67 A76 76 0 1 1 36 192" marker-end="url(#ah)"/>
    <text class="res" x="90" y="236" text-anchor="middle">clockwise → R</text>
  </g>

  <!-- RIGHT: (S), mirror image. centre (270,138) -->
  <g>
    <line class="bond" x1="270" y1="138" x2="270" y2="96"/>
    <line class="bond" x1="270" y1="138" x2="232" y2="160"/>
    <line class="bond" x1="270" y1="138" x2="308" y2="160"/>
    <line class="hash" x1="268" y1="136" x2="256" y2="118"/>
    <circle class="cbg" cx="270" cy="138" r="7.5"/><text class="at" x="270" y="142" text-anchor="middle">C</text>
    <text class="p1" x="270" y="90" text-anchor="middle">OH</text>
    <text class="p2" x="228" y="172" text-anchor="end">C₂H₅</text>
    <text class="p3" x="312" y="172" text-anchor="start">CH₃</text>
    <text class="p4" x="252" y="115" text-anchor="end">H</text>
    <circle class="badge b1" cx="288" cy="94" r="7"/><text class="p1" x="288" y="97.5" text-anchor="middle">1</text>
    <circle class="badge b2" cx="220" cy="150" r="7"/><text class="p2" x="220" y="153.5" text-anchor="middle">2</text>
    <circle class="badge b3" cx="320" cy="150" r="7"/><text class="p3" x="320" y="153.5" text-anchor="middle">3</text>
    <path class="arc" d="M244 67 A76 76 0 1 0 324 192" marker-end="url(#ah)"/>
    <text class="res" x="270" y="236" text-anchor="middle">anticlockwise → S</text>
  </g>

  <!-- steps -->
  <text class="stepn" x="16" y="266">1</text><text class="step" x="28" y="266">Rank the four groups with the CIP rules (1 = highest).</text>
  <text class="stepn" x="16" y="284">2</text><text class="step" x="28" y="284">Point group 4 away from you (hashed bond).</text>
  <text class="stepn" x="16" y="302">3</text><text class="step" x="28" y="302">Trace 1 → 2 → 3: clockwise = R, anticlockwise = S.</text>
  <text class="step" x="28" y="318">(If group 4 points towards you, reverse the answer.)</text>
</svg>
