<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.4; }
    .box2 { fill: #f3f1ea; stroke: #c9c5b8; stroke-width: 1.2; }
    .box3 { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.4; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 800; }
    .ex { fill: #3d4657; font-size: 9.8px; }
    .ln { stroke: #8a94a6; stroke-width: 1.3; fill: none; }
    .bond { stroke: #14213d; stroke-width: 1.8; fill: none; }
    .dbl { stroke: #14213d; stroke-width: 1.8; }
    .at { fill: #14213d; font-size: 10px; font-weight: 700; }
    .me { fill: #0f766e; font-size: 10px; font-weight: 800; }
    .wedge { fill: #14213d; }
    .hash { stroke: #14213d; stroke-width: 1.2; }
    .mir { stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .mirt { fill: #6d28d9; font-size: 9.5px; font-style: italic; }
    .g1 { fill: #dc2626; font-size: 10px; font-weight: 800; } .g2 { fill: #2563eb; font-size: 10px; font-weight: 800; }
    .g3 { fill: #16a34a; font-size: 10px; font-weight: 800; } .g4 { fill: #b45309; font-size: 10px; font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab, .at { fill: #e9edf5; }
      .sub { fill: #9aa5ba; } .ex { fill: #c7cfdd; }
      .box { fill: #1e1b4b; stroke: #a5b4fc; }
      .box2 { fill: #1b263d; stroke: #3a4763; }
      .box3 { fill: #0f2e1d; stroke: #4ade80; }
      .ln { stroke: #6b7894; }
      .bond, .dbl { stroke: #e9edf5; } .wedge { fill: #e9edf5; } .hash { stroke: #e9edf5; }
      .me { fill: #5eead4; }
      .mir { stroke: #c4b5fd; } .mirt { fill: #c4b5fd; }
      .g1 { fill: #fca5a5; } .g2 { fill: #93c5fd; } .g3 { fill: #86efac; } .g4 { fill: #fde68a; }
    }
  </style>
  <rect class="bg" width="360" height="340" rx="14"/>
  <text class="t" x="16" y="28">Types of isomerism</text>
  <text class="sub" x="16" y="45">Same molecular formula, different structure</text>

  <rect class="box" x="130" y="54" width="100" height="26" rx="7"/>
  <text class="lab" x="180" y="71" text-anchor="middle">Isomers</text>
  <path class="ln" d="M180 80 V88 H82 V96 M180 88 H268 V96"/>

  <rect class="box2" x="14" y="96" width="136" height="54" rx="7"/>
  <text class="lab" x="82" y="113" text-anchor="middle">Structural</text>
  <text class="ex" x="82" y="128" text-anchor="middle">different connections:</text>
  <text class="ex" x="82" y="141" text-anchor="middle">chain, position, group</text>

  <rect class="box3" x="200" y="96" width="136" height="54" rx="7"/>
  <text class="lab" x="268" y="113" text-anchor="middle">Stereoisomers</text>
  <text class="ex" x="268" y="128" text-anchor="middle">same connections,</text>
  <text class="ex" x="268" y="141" text-anchor="middle">different 3D arrangement</text>
  <path class="ln" d="M268 150 V160 H92 V170 M268 160 V170"/>

  <!-- cis-trans panel -->
  <rect class="box2" x="14" y="170" width="156" height="160" rx="8"/>
  <text class="lab" x="92" y="187" text-anchor="middle">Cis–trans (E/Z)</text>
  <text class="ex" x="92" y="200" text-anchor="middle">no rotation about C=C</text>
  <!-- cis-but-2-ene -->
  <g transform="translate(52 240)">
    <line class="dbl" x1="-12" y1="-3" x2="12" y2="-3"/><line class="dbl" x1="-12" y1="3" x2="12" y2="3"/>
    <line class="bond" x1="-12" y1="0" x2="-24" y2="-18"/><line class="bond" x1="12" y1="0" x2="24" y2="-18"/>
    <line class="bond" x1="-12" y1="0" x2="-24" y2="18"/><line class="bond" x1="12" y1="0" x2="24" y2="18"/>
    <text class="me" x="-30" y="-20" text-anchor="middle">CH₃</text><text class="me" x="30" y="-20" text-anchor="middle">CH₃</text>
    <text class="at" x="-28" y="30" text-anchor="middle">H</text><text class="at" x="28" y="30" text-anchor="middle">H</text>
    <text class="ex" x="0" y="50" text-anchor="middle">cis (Z)</text><text class="ex" x="0" y="62" text-anchor="middle">same side</text>
  </g>
  <!-- trans-but-2-ene -->
  <g transform="translate(132 240)">
    <line class="dbl" x1="-12" y1="-3" x2="12" y2="-3"/><line class="dbl" x1="-12" y1="3" x2="12" y2="3"/>
    <line class="bond" x1="-12" y1="0" x2="-24" y2="-18"/><line class="bond" x1="12" y1="0" x2="24" y2="-18"/>
    <line class="bond" x1="-12" y1="0" x2="-24" y2="18"/><line class="bond" x1="12" y1="0" x2="24" y2="18"/>
    <text class="me" x="-30" y="-20" text-anchor="middle">CH₃</text><text class="at" x="28" y="-20" text-anchor="middle">H</text>
    <text class="at" x="-28" y="30" text-anchor="middle">H</text><text class="me" x="30" y="30" text-anchor="middle">CH₃</text>
    <text class="ex" x="0" y="50" text-anchor="middle">trans (E)</text><text class="ex" x="0" y="62" text-anchor="middle">opposite sides</text>
  </g>

  <!-- optical panel -->
  <rect class="box2" x="178" y="170" width="168" height="160" rx="8"/>
  <text class="lab" x="262" y="187" text-anchor="middle">Optical (chiral centre)</text>
  <text class="ex" x="262" y="200" text-anchor="middle">4 different groups on one C</text>
  <line class="mir" x1="262" y1="208" x2="262" y2="306"/>
  <text class="mirt" x="262" y="320" text-anchor="middle">mirror</text>
  <!-- left enantiomer -->
  <g transform="translate(212 260)">
    <line class="bond" x1="0" y1="0" x2="0" y2="-26"/>
    <line class="bond" x1="0" y1="0" x2="-24" y2="12"/>
    <polygon class="wedge" points="0,-1.5 0,1.5 22,16 24,10"/>
    <line class="hash" x1="2" y1="-1" x2="20" y2="-9" stroke-width="4" stroke-dasharray="1.5 2"/>
    <text class="at" x="0" y="4" text-anchor="middle" dy="-0">C</text>
    <text class="g1" x="0" y="-30" text-anchor="middle">H</text>
    <text class="g2" x="-30" y="20" text-anchor="middle">CH₃</text>
    <text class="g3" x="30" y="26" text-anchor="middle">OH</text>
    <text class="g4" x="20" y="-13" text-anchor="start" font-size="9">C₂H₅</text>
  </g>
  <!-- right enantiomer (mirror) -->
  <g transform="translate(312 260) scale(-1 1)">
    <line class="bond" x1="0" y1="0" x2="0" y2="-26"/>
    <line class="bond" x1="0" y1="0" x2="-24" y2="12"/>
    <polygon class="wedge" points="0,-1.5 0,1.5 22,16 24,10"/>
    <line class="hash" x1="2" y1="-1" x2="20" y2="-9" stroke-width="4" stroke-dasharray="1.5 2"/>
  </g>
  <text class="at" x="312" y="264" text-anchor="middle">C</text>
  <text class="g1" x="312" y="230" text-anchor="middle">H</text>
  <text class="g2" x="336" y="282" text-anchor="middle">CH₃</text>
  <text class="g3" x="284" y="286" text-anchor="middle">OH</text>
  <text class="g4" x="292" y="247" text-anchor="end" font-size="9">C₂H₅</text>
</svg>
