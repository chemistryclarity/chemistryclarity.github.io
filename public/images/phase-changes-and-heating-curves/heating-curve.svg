<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .ax { stroke: #3d4657; stroke-width: 1.5; fill: none; }
    .grid { stroke: #d6d2c6; stroke-width: 1; stroke-dasharray: 3 3; }
    .curve { stroke: #0f766e; stroke-width: 3; fill: none; stroke-linejoin: round; }
    .flat { stroke: #c2410c; stroke-width: 3.4; }
    .tick { fill: #5b6577; font-size: 10px; }
    .lab { fill: #14213d; font-size: 10.5px; font-weight: 700; }
    .fl { fill: #c2410c; font-size: 10.5px; font-weight: 700; }
    .axl { fill: #5b6577; font-size: 10.5px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab { fill: #e9edf5; }
      .sub, .tick, .axl { fill: #9aa5ba; }
      .ax { stroke: #c7cfdd; }
      .grid { stroke: #2a3550; }
      .curve { stroke: #2dd4bf; }
      .flat { stroke: #fb923c; }
      .fl { fill: #fb923c; }
    }
  </style>
  <rect class="bg" width="360" height="300" rx="14"/>
  <text class="t" x="16" y="28">Heating curve of water</text>
  <text class="sub" x="16" y="45">25.0 g of ice at −15 °C heated to steam at 125 °C</text>

  <!-- axes: x from 50 to 340 (heat, 0..77.3 kJ), y: T from -20 (250) to 130 (70): 1.2 px per °C -->
  <path class="ax" d="M50 66 V250 H342"/>
  <line class="grid" x1="50" y1="226" x2="340" y2="226"/>
  <line class="grid" x1="50" y1="106" x2="340" y2="106"/>
  <text class="tick" x="44" y="229" text-anchor="end">0</text>
  <text class="tick" x="44" y="109" text-anchor="end">100</text>
  <text class="tick" x="44" y="247" text-anchor="end">−15</text>
  <text class="axl" x="16" y="62">T (°C)</text>
  <text class="axl" x="340" y="266" text-anchor="end">heat added (kJ) →</text>

  <!-- x scale: 3.6 px per kJ. Cumulative: 0.78, 9.12, 19.58, 76.05, 77.30 -->
  <!-- y: -15 at 244, 0 at 226, 100 at 106, 125 at 76 -->
  <polyline class="curve" points="50,244 52.8,226"/>
  <line class="flat" x1="52.8" y1="226" x2="82.8" y2="226"/>
  <polyline class="curve" points="82.8,226 120.5,106"/>
  <line class="flat" x1="120.5" y1="106" x2="323.8" y2="106"/>
  <polyline class="curve" points="323.8,106 328.3,76"/>

  <text class="fl" x="70" y="212" text-anchor="middle">melting</text>
  <text class="lab" x="108" y="168" text-anchor="end">water</text>
  <text class="lab" x="108" y="181" text-anchor="end">warms</text>
  <text class="fl" x="222" y="98" text-anchor="middle">boiling (56.5 kJ)</text>
  <text class="lab" x="318" y="80" text-anchor="end">steam</text>
  <text class="lab" x="60" y="244">ice warms</text>
</svg>
