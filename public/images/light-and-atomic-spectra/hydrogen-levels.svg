<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lvl { stroke: #3d4657; stroke-width: 1.6; }
    .lvli { stroke: #8a94a6; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .n { fill: #14213d; font-size: 10.5px; font-weight: 700; }
    .ex { fill: #5b6577; font-size: 10px; }
    .strip { fill: #0b1020; }
    .uv { stroke: #6d28d9; stroke-width: 2; stroke-dasharray: 5 3; }
    .uvt { fill: #6d28d9; font-size: 10px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .n { fill: #e9edf5; }
      .sub, .ex { fill: #9aa5ba; }
      .lvl { stroke: #c7cfdd; }
      .lvli { stroke: #6b7894; }
      .strip { fill: #05070f; }
      .uv { stroke: #c4b5fd; } .uvt { fill: #c4b5fd; }
    }
  </style>
  <defs>
    <marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#dc2626" d="M0 0 10 5 0 10z"/></marker>
    <marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#0891b2" d="M0 0 10 5 0 10z"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#4f46e5" d="M0 0 10 5 0 10z"/></marker>
    <marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#7c3aed" d="M0 0 10 5 0 10z"/></marker>
    <marker id="mu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path fill="#6d28d9" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="bg" width="360" height="360" rx="14"/>
  <text class="t" x="20" y="28">Hydrogen energy levels</text>
  <text class="sub" x="20" y="45">Drops to n = 2 give the visible lines.</text>

  <!-- levels: y = 70 + 190/n^2 -->
  <line class="lvli" x1="56" y1="66" x2="330" y2="66"/><text class="n" x="20" y="69">n = ∞</text>
  <line class="lvl" x1="56" y1="75.3" x2="330" y2="75.3"/>
  <line class="lvl" x1="56" y1="77.6" x2="330" y2="77.6"/>
  <line class="lvl" x1="56" y1="81.9" x2="330" y2="81.9"/><text class="n" x="20" y="84">n = 4</text>
  <line class="lvl" x1="56" y1="91.1" x2="330" y2="91.1"/><text class="n" x="20" y="95">n = 3</text>
  <line class="lvl" x1="56" y1="117.5" x2="330" y2="117.5"/><text class="n" x="20" y="121">n = 2</text>
  <line class="lvl" x1="56" y1="260" x2="330" y2="260"/><text class="n" x="20" y="264">n = 1</text>
  <text class="ex" x="330" y="278" text-anchor="end">ground state (lowest energy)</text>

  <!-- visible transitions to n = 2 -->
  <line x1="120" y1="91.1" x2="120" y2="115" stroke="#dc2626" stroke-width="2.4" marker-end="url(#mr)"/>
  <line x1="160" y1="81.9" x2="160" y2="115" stroke="#0891b2" stroke-width="2.4" marker-end="url(#mc)"/>
  <line x1="200" y1="77.6" x2="200" y2="115" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#mb)"/>
  <line x1="240" y1="75.3" x2="240" y2="115" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#mv)"/>
  <text x="120" y="133" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="700">656</text>
  <text x="160" y="133" text-anchor="middle" fill="#0891b2" font-size="10" font-weight="700">486</text>
  <text x="200" y="133" text-anchor="middle" fill="#4f46e5" font-size="10" font-weight="700">434</text>
  <text x="240" y="133" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="700">410 nm</text>

  <!-- UV transition 2 -> 1 -->
  <line class="uv" x1="295" y1="117.5" x2="295" y2="256" marker-end="url(#mu)"/>
  <text class="uvt" x="290" y="190" text-anchor="end">122 nm (UV)</text>

  <!-- visible spectrum strip: x = 40 + (λ − 400) × 280/300 -->
  <rect class="strip" x="40" y="296" width="280" height="26" rx="3"/>
  <rect x="277.9" y="296" width="2.4" height="26" fill="#ef4444"/>
  <rect x="119.3" y="296" width="2.4" height="26" fill="#22d3ee"/>
  <rect x="70.7" y="296" width="2.4" height="26" fill="#6366f1"/>
  <rect x="48.3" y="296" width="2.4" height="26" fill="#a855f7"/>
  <text class="ex" x="40" y="338">400 nm</text>
  <text class="ex" x="320" y="338" text-anchor="end">700 nm</text>
  <text class="ex" x="180" y="352" text-anchor="middle">Emission spectrum of hydrogen (visible part)</text>
</svg>
