    .lab { fill: #14213d; font-size: 11px; font-weight: 700; }
    .ex { fill: #5b6577; font-size: 10px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab, .il { fill: #e9edf5; }
      .sub, .ex { fill: #9aa5ba; }
      .o { fill: #7f1d1d; stroke: #fca5a5; }
      .h { fill: #334155; stroke: #cbd5e1; }
      .bd { stroke: #cbd5e1; }
      .na { fill: #3b2f6b; stroke: #c4b5fd; }
      .cl { fill: #14532d; stroke: #86efac; }
    }
