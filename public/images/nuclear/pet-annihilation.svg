ansform="rotate(300.0 84.7 131.0)"/><rect class="det" x="93.21825406947976" y="102.21825406947978" width="18" height="12" rx="2" transform="rotate(315.0 102.2 108.2)"/><rect class="det" x="115.99999999999994" y="84.73720558371177" width="18" height="12" rx="2" transform="rotate(330.0 125.0 90.7)"/><rect class="det" x="142.52990503872275" y="73.74815910820249" width="18" height="12" rx="2" transform="rotate(345.0 151.5 79.7)"/><rect class="det" x="170.99999999999997" y="70" width="18" height="12" rx="2" transform="rotate(360.0 180.0 76.0)"/><rect class="det" x="199.47009496127723" y="73.74815910820247" width="18" height="12" rx="2" transform="rotate(375.0 208.5 79.7)"/><rect class="det" x="226" y="84.73720558371176" width="18" height="12" rx="2" transform="rotate(390.0 235.0 90.7)"/><rect class="det" x="248.78174593052017" y="102.21825406947976" width="18" height="12" rx="2" transform="rotate(405.0 257.8 108.2)"/><rect class="det" x="266.2627944162882" y="124.99999999999994" width="18" height="12" rx="2" transform="rotate(420.0 275.3 131.0)"/><rect class="det" x="277.25184089179754" y="151.52990503872272" width="18" height="12" rx="2" transform="rotate(435.0 286.3 157.5)"/><ellipse class="body" cx="180" cy="186" rx="62" ry="48"/><circle class="pA" cx="158" cy="194" r="6"/><text class="lA" x="148" y="198" text-anchor="end">¹⁸F</text><path class="short" d="M164 192 Q 172 182, 178 182"/><circle class="pos" cx="178" cy="182" r="3"/><circle class="ele" cx="186" cy="182" r="3"/><text class="lA" x="160" y="178" text-anchor="middle">e⁺</text><text class="hbl" x="194" y="196">e⁻</text><path class="gam" d="M182 182 L237.8 103.9"/><path class="gam" d="M182 182 L126.2 260.1"/><text class="lC" x="228.9" y="137.2">γ 511 keV</text><text class="lC" x="135.1" y="234.8" text-anchor="end">γ 511 keV</text><text class="sub" x="20" y="326">Positron + electron annihilate: their mass becomes two gamma rays.</text>
