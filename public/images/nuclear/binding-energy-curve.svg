  <rect class="bg" width="360" height="380" rx="14"/><text class="t" x="20" y="28">Binding energy per nucleon</text><text class="sub" x="20" y="45">Higher on the curve = more tightly bound = more stable.</text><line class="grid" x1="52" y1="300" x2="336" y2="300"/><text class="num" x="46" y="303.5" text-anchor="end">0</text><line class="grid" x1="52" y1="254" x2="336" y2="254"/><text class="num" x="46" y="257.5" text-anchor="end">2</text><line class="grid" x1="52" y1="208" x2="336" y2="208"/><text class="num" x="46" y="211.5" text-anchor="end">4</text><line class="grid" x1="52" y1="162" x2="336" y2="162"/><text class="num" x="46" y="165.5" text-anchor="end">6</text><line class="grid" x1="52" y1="116" x2="336" y2="116"/><text class="num" x="46" y="119.5" text-anchor="end">8</text><line class="grid" x1="52" y1="70" x2="336" y2="70"/><text class="num" x="46" y="73.5" text-anchor="end">10</text><text class="num" x="52" y="315" text-anchor="middle">0</text><text class="num" x="123" y="315" text-anchor="middle">60</text><text class="num" x="194" y="315" text-anchor="middle">120</text><text class="num" x="265" y="315" text-anchor="middle">180</text><text class="num" x="336" y="315" text-anchor="middle">240</text><path class="axis" d="M52 64 V300 H340"/><path class="curve" d="M54.4 274.4 L55.5 235.0 L59.1 177.4 L60.3 171.1 L62.6 151.4 L66.2 123.4 L70.9 116.6 L75.7 115.3 L80.4 110.0 L85.1 105.7 L89.9 104.7 L99.3 103.3 L118.3 97.8 L125.4 97.7 L151.4 99.5 L194.0 104.4 L215.3 107.0 L298.1 119.0 L330.1 125.4 L333.6 125.9"/><circle class="pt" cx="54.4" cy="274.4" r="2.6"/><circle class="pt" cx="55.5" cy="235.0" r="2.6"/><circle class="pt" cx="56.7" cy="137.3" r="2.6"/><circle class="pt" cx="59.1" cy="177.4" r="2.6"/><circle class="pt" cx="60.3" cy="171.1" r="2.6"/><circle class="pt" cx="62.6" cy="151.4" r="2.6"/><circle class="pt" cx="66.2" cy="123.4" r="2.6"/><circle class="pt" cx="70.9" cy="116.6" r="2.6"/><circle class="pt" cx="75.7" cy="115.3" r="2.6"/><circle class="pt" cx="