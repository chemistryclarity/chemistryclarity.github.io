<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .pt { fill: #14213d; font-size: 12px; font-weight: 700; }
    .num { fill: #5b6577; font-size: 10px; }
    .al { fill: #14213d; font-size: 11px; font-weight: 600; }
    .grid { stroke: #ece9e1; stroke-width: 1; }
    .axis { stroke: #14213d; stroke-width: 1.3; fill: none; }
    .curve { stroke: #0f766e; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .dashl { stroke: #0f766e; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .pt2 { fill: #b45309; }
    .note { fill: #5b6577; font-size: 10.5px; }
    .note2 { fill: #b45309; font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .pt, .al { fill: #e9edf5; }
      .sub, .num, .note { fill: #9aa5ba; }
      .grid { stroke: #27324a; } .axis { stroke: #e9edf5; }
      .curve, .dashl { stroke: #2dd4bf; }
      .pt2 { fill: #fbbf24; } .note2 { fill: #fbbf24; }
    }
  </style>
  <rect class="bg" width="360" height="560" rx="14"/>
