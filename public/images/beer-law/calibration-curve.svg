<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .num { fill: #5b6577; font-size: 10px; }
    .ax { fill: #14213d; font-size: 11px; font-weight: 600; }
    .axis { stroke: #8a94a6; stroke-width: 1.3; fill: none; }
    .grid { stroke: #e3e7ee; stroke-width: 1; }
    .guide { stroke: #b45309; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
    .curve { stroke: #0f766e; stroke-width: 2.6; fill: none; }
    .pt { fill: #0f766e; } .ptB { fill: #b45309; }
    .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .rayA { stroke: #b45309; stroke-width: 2.6; fill: none; } .rayB { stroke: #0f766e; stroke-width: 2.6; fill: none; } .rayC { stroke: #7c3aed; stroke-width: 2.6; fill: none; stroke-dasharray: 7 3; }
    .rayCf { stroke: #7c3aed; stroke-width: 1.4; fill: none; stroke-dasharray: 3 3; }
    .paper { fill: #f3f1ea; stroke: #c9c5b8; stroke-width: 1.2; } .al { fill: #d9dee7; stroke: #9aa5ba; stroke-width: 1.2; } .pb { fill: #8a94a6; stroke: #5b6577; stroke-width: 1.2; }
    .src { fill: #14213d; } .srcT { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .box { fill: #f6f8fb; stroke: #8a94a6; stroke-width: 1.5; }
    .beam { stroke: #d97706; stroke-width: 3; fill: none; } .beam2 { stroke: #d97706; stroke-width: 1.6; fill: none; }
    .sol { fill: #c4b5fd; opacity: 0.75; } .cuv { fill: none; stroke: #14213d; stroke-width: 1.5; }
    .dim { stroke: #14213d; stroke-width: 1.2; fill: none; marker-start: url(#hd); marker-end: url(#hd); }
    .hd { fill: #14213d; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .lab, .ax { fill: #e9edf5; } .sub, .num { fill: #9aa5ba; }
      .axis { stroke: #6b7894; } .grid { stroke: #2a3550; } .guide { stroke: #fbbf24; }
      .curve, .rayB { stroke: #2dd4bf; } .pt, .lA { fill: #2dd4bf; } .ptB, .lB { fill: #fbbf24; } .rayA { stroke: #fbbf24; }
      .lC { fill: #c4b5fd; } .rayC, .rayCf { stroke: #c4b5fd; }
      .paper { fill: #3a4763; stroke: #6b7894; } .al { fill: #4b5875; stroke: #9aa5ba; } .pb { fill: #6b7894; stroke: #9aa5ba; }
      .src { fill: #e9edf5; } .srcT { fill: #151e31; }
      .box { fill: #1b263d; stroke: #6b7894; } .beam, .beam2 { stroke: #fbbf24; } .sol { fill: #7c3aed; opacity: 0.6; } .cuv { stroke: #e9edf5; }
      .dim { stroke: #e9edf5; } .hd { fill: #e9edf5; }
    }
  </style>
  <defs><marker id="hd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hd" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="380" rx="14"/><text class="t" x="20" y="28">Calibration curve</text><text class="sub" x="20" y="45">Standards of known concentration; unknown read from the line.</text><line class="grid" x1="60" y1="300" x2="334" y2="300"/><text class="num" x="54" y="303.5" text-anchor="end">0.0</text><line class="grid" x1="60" y1="258.9090909090909" x2="334" y2="258.9090909090909"/><text class="num" x="54" y="262.4090909090909" text-anchor="end">0.2</text><line class="grid" x1="60" y1="217.8181818181818" x2="334" y2="217.8181818181818"/><text class="num" x="54" y="221.3181818181818" text-anchor="end">0.4</text><line class="grid" x1="60" y1="176.7272727272727" x2="334" y2="176.7272727272727"/><text class="num" x="54" y="180.2272727272727" text-anchor="end">0.6</text><line class="grid" x1="60" y1="135.63636363636363" x2="334" y2="135.63636363636363"/><text class="num" x="54" y="139.13636363636363" text-anchor="end">0.8</text><line class="grid" x1="60" y1="94.54545454545456" x2="334" y2="94.54545454545456"/><text class="num" x="54" y="98.04545454545456" text-anchor="end">1.0</text><text class="num" x="60" y="315" text-anchor="middle">0</text><text class="num" x="109.81818181818181" y="315" text-anchor="middle">1</text><text class="num" x="159.63636363636363" y="315" text-anchor="middle">2</text><text class="num" x="209.45454545454544" y="315" text-anchor="middle">3</text><text class="num" x="259.27272727272725" y="315" text-anchor="middle">4</text><text class="num" x="309.0909090909091" y="315" text-anchor="middle">5</text><path class="axis" d="M60 68 V300 H338"/><line class="curve" x1="60" y1="299.5890909090909" x2="324.03636363636366" y2="83.33174545454548"/><circle class="pt" cx="109.81818181818181" cy="258.70363636363635" r="4.2"/><circle class="pt" cx="159.63636363636363" cy="218.02363636363634" r="4.2"/><circle class="pt" cx="209.45454545454544" cy="177.13818181818183" r="4.2"/><circle class="pt" cx="259.27272727272725" cy="136.66363636363639" r="4.2"/><circle class="pt" cx="309.0909090909091" cy="95.36727272727273" r="4.2"/><path class="guide" d="M60 215.29109090909094 H162.92245720040282 V300"/><circle class="ptB" cx="162.92245720040282" cy="215.29109090909094" r="5"/><text class="lB" x="66" y="208.29109090909094">A = 0.412</text><text class="lB" x="168.92245720040282" y="292">c = 2.07 mg/L</text><text class="lA" x="68" y="94.54545454545456">A = (0.1986 L/mg) c + 0.0020</text><text class="ax" x="197" y="332" text-anchor="middle">concentration, c (mg/L)</text><text class="ax" transform="translate(20 187) rotate(-90)" text-anchor="middle">absorbance, A</text><circle class="pt" cx="26" cy="362" r="4"/><text class="sub" x="34" y="366">standards</text><circle class="ptB" cx="112" cy="362" r="4"/><text class="sub" x="120" y="366">unknown (mean of 3 replicates)</text>
</svg>
