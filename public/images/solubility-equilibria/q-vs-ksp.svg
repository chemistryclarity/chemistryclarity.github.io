<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .z1 { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.3; }
    .z2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.3; }
    .z3 { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.3; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 800; }
    .ex { fill: #3d4657; font-size: 9.8px; }
    .ax { stroke: #3d4657; stroke-width: 1.6; fill: none; }
    .ah { fill: #3d4657; }
    .mk { stroke: #16a34a; stroke-width: 3; }
    .mkt { fill: #15803d; font-size: 11px; font-weight: 800; }
    .glass { fill: none; stroke: #5b6577; stroke-width: 1.4; }
    .water { fill: #dbeafe; }
    .solid { fill: #94a3b8; }
    .ion { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab { fill: #e9edf5; }
      .sub { fill: #9aa5ba; }
      .ex { fill: #c7cfdd; }
      .z1 { fill: #0c2a3e; stroke: #38bdf8; }
      .z2 { fill: #0f2e1d; stroke: #4ade80; }
      .z3 { fill: #3f1515; stroke: #f87171; }
      .ax { stroke: #c7cfdd; } .ah { fill: #c7cfdd; }
      .mk { stroke: #4ade80; } .mkt { fill: #86efac; }
      .glass { stroke: #9aa5ba; } .water { fill: #1e3a5f; } .solid { fill: #cbd5e1; } .ion { fill: #c4b5fd; }
    }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="240" rx="14"/>
  <text class="t" x="16" y="28">Ion product Q versus Ksp</text>
  <text class="sub" x="16" y="45">Increasing ion concentrations →</text>

  <!-- three zones -->
  <rect class="z1" x="14" y="58" width="128" height="120" rx="8"/>
  <rect class="z2" x="146" y="58" width="68" height="120" rx="8"/>
  <rect class="z3" x="218" y="58" width="128" height="120" rx="8"/>

  <text class="lab" x="78" y="76" text-anchor="middle">Q &lt; Ksp</text>
  <text class="ex" x="78" y="91" text-anchor="middle">unsaturated</text>
  <text class="ex" x="78" y="104" text-anchor="middle">more solid dissolves</text>
  <text class="lab" x="180" y="76" text-anchor="middle">Q = Ksp</text>
  <text class="ex" x="180" y="91" text-anchor="middle">saturated</text>
  <text class="ex" x="180" y="104" text-anchor="middle">equilibrium</text>
  <text class="lab" x="282" y="76" text-anchor="middle">Q &gt; Ksp</text>
  <text class="ex" x="282" y="91" text-anchor="middle">supersaturated</text>
  <text class="ex" x="282" y="104" text-anchor="middle">precipitate forms</text>

  <!-- beakers -->
  <g transform="translate(60 114)">
    <path class="water" d="M2 14 H34 V52 H2 Z"/><path class="glass" d="M0 6 V54 H36 V6"/>
    <circle class="ion" cx="10" cy="26" r="2.2"/><circle class="ion" cx="26" cy="38" r="2.2"/>
  </g>
  <g transform="translate(162 114)">
    <path class="water" d="M2 14 H34 V52 H2 Z"/><path class="glass" d="M0 6 V54 H36 V6"/>
    <circle class="ion" cx="8" cy="22" r="2.2"/><circle class="ion" cx="18" cy="34" r="2.2"/><circle class="ion" cx="28" cy="24" r="2.2"/><circle class="ion" cx="12" cy="40" r="2.2"/>
    <path class="solid" d="M4 52 Q18 44 32 52 Z"/>
  </g>
  <g transform="translate(264 114)">
    <path class="water" d="M2 14 H34 V52 H2 Z"/><path class="glass" d="M0 6 V54 H36 V6"/>
    <circle class="ion" cx="8" cy="22" r="2.2"/><circle class="ion" cx="18" cy="30" r="2.2"/><circle class="ion" cx="28" cy="22" r="2.2"/>
    <path class="solid" d="M3 52 Q18 38 33 52 Z"/>
  </g>

  <!-- axis -->
  <path class="ax" d="M14 200 H344" marker-end="url(#ah)"/>
  <line class="mk" x1="180" y1="190" x2="180" y2="210"/>
  <text class="mkt" x="180" y="226" text-anchor="middle">Ksp</text>
  <text class="ex" x="16" y="226">smaller Q</text>
  <text class="ex" x="344" y="226" text-anchor="end">larger Q</text>
</svg>
