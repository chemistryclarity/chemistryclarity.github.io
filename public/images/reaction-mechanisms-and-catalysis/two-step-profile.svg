  <path class="arr" d="M318 218.3 V285.5"/><text class="ar" x="312" y="255.9" text-anchor="end">ΔH</text>
  <text class="ar" x="68" y="234.3">reactants</text><text class="ar" x="330" y="303.5" text-anchor="end">products</text>
  <text class="al" x="200" y="346" text-anchor="middle">Reaction progress</text>
  <text class="al" x="40" y="191" text-anchor="middle" transform="rotate(-90 40 191)">Energy</text>
  <text class="sub" x="20" y="370">Step 1 has the higher barrier from the reactants, so it is</text>
  <text class="sub" x="20" y="384">the slow, rate-determining step.</text>
</svg>
