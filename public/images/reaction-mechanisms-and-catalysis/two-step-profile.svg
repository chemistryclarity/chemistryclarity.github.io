<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .num { fill: #5b6577; font-size: 10px; }
    .al { fill: #14213d; font-size: 11px; font-weight: 600; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .grid { stroke: #ece9e1; stroke-width: 1; }
    .axis { stroke: #14213d; stroke-width: 1.3; fill: none; }
    .lvl { stroke: #14213d; stroke-width: 2.4; }
    .cA { stroke: #0f766e; stroke-width: 2.6; fill: none; } .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; }
    .cB { stroke: #b45309; stroke-width: 2.6; fill: none; } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; }
    .cC { stroke: #7c3aed; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .down { stroke: #0f766e; stroke-width: 2.4; fill: none; marker-end: url(#hdA); }
    .up { stroke: #b45309; stroke-width: 2.4; fill: none; marker-end: url(#hdB); }
    .step { stroke: #7c3aed; stroke-width: 2.2; fill: none; marker-end: url(#hdC); }
    .guide { stroke: #8a94a6; stroke-width: 1.1; stroke-dasharray: 3 3; fill: none; }
    .dot { fill: #b45309; }
    .arr { stroke: #14213d; stroke-width: 1.4; fill: none; marker-end: url(#hd); marker-start: url(#hs); }
    .hd { fill: #14213d; } .hdA { fill: #0f766e; } .hdB { fill: #b45309; } .hdC { fill: #7c3aed; }
    .ar { fill: #14213d; font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .al, .ar, .lab { fill: #e9edf5; } .sub, .num { fill: #9aa5ba; }
      .grid { stroke: #27324a; } .axis, .arr, .lvl { stroke: #e9edf5; } .hd { fill: #e9edf5; }
      .cA, .down { stroke: #2dd4bf; } .lA, .hdA { fill: #2dd4bf; } .cB, .up { stroke: #fbbf24; } .lB, .hdB, .dot { fill: #fbbf24; }
      .cC, .step { stroke: #c4b5fd; } .lC, .hdC { fill: #c4b5fd; } .guide { stroke: #6b7894; }
    }
  </style>
  <defs>
    <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hd" d="M0 0 10 5 0 10z"/></marker>
    <marker id="hs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hd" d="M10 0 0 5 10 10z"/></marker>
    <marker id="hdA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hdA" d="M0 0 10 5 0 10z"/></marker>
    <marker id="hdB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hdB" d="M0 0 10 5 0 10z"/></marker>
    <marker id="hdC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hdC" d="M0 0 10 5 0 10z"/></marker>
  </defs>
