<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .cell { fill: #f3f1ea; stroke: #c9c5b8; stroke-width: 1.2; }
    .lab { fill: #14213d; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#hd); }
    .hd { fill: #0f766e; }
    .num { fill: #14213d; font-size: 10.5px; }
    .bar { fill: #0f766e; }
    .barx { fill: #b45309; }
    .axis { stroke: #14213d; stroke-width: 1.3; fill: none; }
    .grid { stroke: #ece9e1; stroke-width: 1; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab, .num { fill: #e9edf5; }
      .sub { fill: #9aa5ba; }
      .cell { fill: #1b263d; stroke: #3a4763; }
      .arrow { stroke: #2dd4bf; } .hd { fill: #2dd4bf; }
      .bar { fill: #2dd4bf; } .barx { fill: #fbbf24; }
      .axis { stroke: #e9edf5; } .grid { stroke: #27324a; }
    }
  </style>
  <rect class="bg" width="360" height="360" rx="14"/>
  <text class="t" x="20" y="28">First ionization energy, period 2</text>
  <text class="sub" x="20" y="45">kJ/mol. The general trend rises across the period.</text>
