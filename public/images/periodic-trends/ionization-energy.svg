  <rect class="bar" x="56" y="220.3" width="30" height="49.7"/><text class="lab" x="71" y="286" text-anchor="middle">Li</text><text class="num" x="71" y="215.3" text-anchor="middle">520</text><rect class="bar" x="90.5" y="184.1" width="30" height="85.9"/><text class="lab" x="105.5" y="286" text-anchor="middle">Be</text><text class="num" x="105.5" y="179.1" text-anchor="middle">900</text><rect class="barx" x="125" y="193.6" width="30" height="76.4"/><text class="lab" x="140" y="286" text-anchor="middle">B</text><text class="num" x="140" y="188.6" text-anchor="middle">801</text><rect class="bar" x="159.5" y="166.3" width="30" height="103.7"/><text class="lab" x="174.5" y="286" text-anchor="middle">C</text><text class="num" x="174.5" y="161.3" text-anchor="middle">1087</text><rect class="bar" x="194" y="136.1" width="30" height="133.9"/><text class="lab" x="209" y="286" text-anchor="middle">N</text><text class="num" x="209" y="131.1" text-anchor="middle">1402</text><rect class="barx" x="228.5" y="144.6" width="30" height="125.4"/><text class="lab" x="243.5" y="286" text-anchor="middle">O</text><text class="num" x="243.5" y="139.6" text-anchor="middle">1314</text><rect class="bar" x="263" y="109.5" width="30" height="160.5"/><text class="lab" x="278" y="286" text-anchor="middle">F</text><text class="num" x="278" y="104.5" text-anchor="middle">1681</text><rect class="bar" x="297.5" y="71.4" width="30" height="198.6"/><text class="lab" x="312.5" y="286" text-anchor="middle">Ne</text><text class="num" x="312.5" y="66.4" text-anchor="middle">2081</text>
  <path class="axis" d="M52 56 V270 H340"/>
