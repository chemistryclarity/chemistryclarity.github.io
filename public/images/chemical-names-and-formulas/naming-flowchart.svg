<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .box { fill: #f3f1ea; stroke: #c9c5b8; stroke-width: 1.3; }
    .boxa { fill: #e6f4f1; stroke: #0f766e; stroke-width: 1.6; }
    .boxb { fill: #f3effe; stroke: #7c3aed; stroke-width: 1.6; }
    .lab { fill: #14213d; font-size: 12.5px; font-weight: 700; }
    .ex { fill: #3d4657; font-size: 10.5px; }
    .eg { fill: #b45309; font-size: 10.5px; font-weight: 700; }
    .line { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#hd); }
    .hd { fill: #8a94a6; }
    .yn { fill: #5b6577; font-size: 10.5px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab { fill: #e9edf5; }
      .sub, .yn { fill: #9aa5ba; }
      .ex { fill: #c7cfdd; }
      .eg { fill: #fbbf24; }
      .box { fill: #1b263d; stroke: #3a4763; }
      .boxa { fill: #123a3a; stroke: #2dd4bf; }
      .boxb { fill: #2a2347; stroke: #c4b5fd; }
      .line { stroke: #6b7894; }
      .hd { fill: #6b7894; }
    }
  </style>
  <defs><marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hd" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="330" rx="14"/>
  <text class="t" x="20" y="28">Naming a compound</text>
  <text class="sub" x="20" y="45">First decide: ionic or molecular?</text>

  <rect class="box" x="60" y="58" width="240" height="44" rx="8"/>
  <text class="lab" x="180" y="77" text-anchor="middle">Contains a metal</text>
  <text class="lab" x="180" y="93" text-anchor="middle">or the ammonium ion?</text>

  <path class="line" d="M120 102 L95 128"/>
  <path class="line" d="M240 102 L265 128"/>
  <text class="yn" x="98" y="114" text-anchor="end">Yes</text>
  <text class="yn" x="262" y="114">No</text>

  <rect class="boxa" x="14" y="132" width="162" height="182" rx="8"/>
  <text class="lab" x="95" y="152" text-anchor="middle">Ionic</text>
  <text class="ex" x="24" y="174">1. Name the cation</text>
  <text class="ex" x="24" y="190">   (+ Roman numeral if the</text>
  <text class="ex" x="24" y="204">   metal forms several ions)</text>
  <text class="ex" x="24" y="222">2. Name the anion:</text>
  <text class="ex" x="24" y="236">   -ide or -ate</text>
  <text class="ex" x="24" y="254">3. No prefixes</text>
  <text class="eg" x="24" y="280">FeCl₃</text>
  <text class="eg" x="24" y="296">iron(III) chloride</text>

  <rect class="boxb" x="184" y="132" width="162" height="182" rx="8"/>
  <text class="lab" x="265" y="152" text-anchor="middle">Molecular</text>
  <text class="ex" x="194" y="174">1. Prefixes count atoms:</text>
  <text class="ex" x="194" y="190">   mono, di, tri, tetra,</text>
  <text class="ex" x="194" y="204">   penta, hexa...</text>
  <text class="ex" x="194" y="222">2. No "mono" on the</text>
  <text class="ex" x="194" y="236">   first element</text>
  <text class="ex" x="194" y="254">3. Second element: -ide</text>
  <text class="eg" x="194" y="280">N₂O₅</text>
  <text class="eg" x="194" y="296">dinitrogen pentoxide</text>
</svg>
