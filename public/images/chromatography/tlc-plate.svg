<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .num { fill: #5b6577; font-size: 10px; }
    .ax { fill: #14213d; font-size: 11px; font-weight: 600; }
    .axis { stroke: #8a94a6; stroke-width: 1.3; fill: none; }
    .grid { stroke: #e3e7ee; stroke-width: 1; }
    .curve { stroke: #0f766e; stroke-width: 2.4; fill: none; }
    .pt { fill: #0f766e; } .ptB { fill: #b45309; }
    .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .arA { stroke: #b45309; stroke-width: 2.4; fill: none; marker-end: url(#hB); } .arC { stroke: #7c3aed; stroke-width: 2.4; fill: none; marker-end: url(#hC); }
    .neu { stroke: #14213d; stroke-width: 1.6; fill: none; marker-end: url(#hD); }
    .hB { fill: #b45309; } .hC { fill: #7c3aed; } .hD { fill: #14213d; }
    .u235 { fill: #0f766e; } .frag { fill: #b45309; } .nDot { fill: #14213d; }
    .wt { fill: #ffffff; font-size: 9.5px; font-weight: 700; }
    .plate { fill: #f6f8fb; stroke: #8a94a6; stroke-width: 1.5; }
    .solv { fill: #cfe0f7; } .line { stroke: #5b6577; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .front { stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .dim { stroke: #14213d; stroke-width: 1.1; fill: none; marker-start: url(#hD); marker-end: url(#hD); }
    .s1 { fill: #dc2626; } .s2 { fill: #2563eb; } .s3 { fill: #ca8a04; }
    .peak { stroke: #0f766e; stroke-width: 2; fill: none; } .peakF { fill: #0f766e; opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .lab, .ax { fill: #e9edf5; } .sub, .num { fill: #9aa5ba; }
      .axis { stroke: #6b7894; } .grid { stroke: #2a3550; }
      .curve, .peak { stroke: #2dd4bf; } .pt, .lA, .u235, .peakF { fill: #2dd4bf; } .ptB, .lB, .frag, .hB { fill: #fbbf24; } .arA { stroke: #fbbf24; }
      .lC, .hC { fill: #c4b5fd; } .arC { stroke: #c4b5fd; } .neu, .dim { stroke: #e9edf5; } .hD, .nDot { fill: #e9edf5; }
      .wt { fill: #151e31; }
      .plate { fill: #1b263d; stroke: #6b7894; } .solv { fill: #1e3354; } .line { stroke: #9aa5ba; } .front { stroke: #60a5fa; }
      .s1 { fill: #f87171; } .s2 { fill: #60a5fa; } .s3 { fill: #facc15; }
    }
  </style>
  <defs><marker id="hB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hB" d="M0 0 10 5 0 10z"/></marker><marker id="hC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hC" d="M0 0 10 5 0 10z"/></marker><marker id="hD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hD" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="360" height="360" rx="14"/><text class="t" x="20" y="28">Thin-layer chromatography</text><text class="sub" x="20" y="45">Rf = distance moved by spot ÷ distance moved by solvent</text><rect class="solv" x="70" y="282" width="150" height="18"/><rect class="plate" x="70" y="64" width="150" height="236" rx="3" fill-opacity="0.7"/><line class="line" x1="70" y1="270" x2="220" y2="270"/><line class="front" x1="70" y1="100" x2="220" y2="100"/><ellipse class="s1" cx="108" cy="200.25641025641025" rx="9" ry="6"/><ellipse class="s2" cx="108" cy="137.05128205128204" rx="9" ry="6"/><ellipse class="s1" cx="182" cy="200.25641025641025" rx="9" ry="6"/><circle class="nDot" cx="108" cy="270" r="2.2"/><text class="num" x="108" y="296" text-anchor="middle">mixture</text><circle class="nDot" cx="182" cy="270" r="2.2"/><text class="num" x="182" y="296" text-anchor="middle">dye A</text><path class="dim" d="M238 270 V100"/><text class="lab" x="246" y="185">7.80 cm</text><path class="dim" d="M54 270 V200.25641025641025"/><text class="lab" x="48" y="239.12820512820514" text-anchor="end">3.20</text><text class="lab" x="48" y="253.12820512820514" text-anchor="end">cm</text><text class="lab" x="246" y="104">solvent front</text><text class="lab" x="246" y="274">baseline</text><text class="sub" x="20" y="330">Red spot: Rf = 3.20 cm ÷ 7.80 cm = 0.410, same as dye A.</text><text class="sub" x="20" y="346">The blue spot (Rf 0.782) is a second, different dye.</text>
</svg>
