<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .acid { fill: #fff1f2; stroke: #be123c; stroke-width: 2; }
    .base { fill: #eef3ff; stroke: #1d4ed8; stroke-width: 2; }
    .f { fill: #14213d; font-size: 20px; font-weight: 700; }
    .role { font-size: 11.5px; font-weight: 700; }
    .ra { fill: #be123c; } .rb { fill: #1d4ed8; }
    .sub { fill: #5b6577; font-size: 11.5px; }
    .h { fill: #7c3aed; font-size: 12.5px; font-weight: 750; }
    .arrow { stroke: #14213d; stroke-width: 2; fill: none; marker-end: url(#hd); }
    .harrow { stroke: #7c3aed; stroke-width: 2.5; fill: none; marker-end: url(#hp); }
    .pair1 { stroke: #be123c; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .pair2 { stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .hd { fill: #14213d; } .hp { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .acid { fill: #3a1420; stroke: #fda4af; }
      .base { fill: #172447; stroke: #93b4ff; }
      .f { fill: #e9edf5; }
      .ra { fill: #fda4af; } .rb { fill: #93b4ff; }
      .sub { fill: #9aa5ba; }
      .h { fill: #c4b5fd; }
      .arrow { stroke: #e9edf5; } .hd { fill: #e9edf5; }
      .harrow { stroke: #c4b5fd; } .hp { fill: #c4b5fd; }
      .pair1 { stroke: #fda4af; } .pair2 { stroke: #93b4ff; }
    }
  </style>
  <defs>
    <marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="hd" d="M0 0 10 5 0 10z"/></marker>
    <marker id="hp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="hp" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="bg" width="360" height="380" rx="14"/>

  <!-- proton jump -->
  <path class="harrow" d="M95 52 C 140 18, 220 18, 262 50"/>
  <text class="h" x="180" y="22" text-anchor="middle">H⁺ moves</text>

  <!-- reactants -->
  <rect class="acid" x="22" y="56" width="140" height="74" rx="12"/>
  <text class="f" x="92" y="94" text-anchor="middle">HCl</text>
  <text class="role ra" x="92" y="116" text-anchor="middle">ACID · gives H⁺</text>
  <text class="f" x="180" y="100" text-anchor="middle">+</text>
  <rect class="base" x="198" y="56" width="140" height="74" rx="12"/>
  <text class="f" x="268" y="94" text-anchor="middle">H₂O</text>
  <text class="role rb" x="268" y="116" text-anchor="middle">BASE · takes H⁺</text>

  <path class="arrow" d="M180 140 V196"/>

  <!-- products -->
  <rect class="acid" x="22" y="206" width="140" height="74" rx="12"/>
  <text class="f" x="92" y="244" text-anchor="middle">Cl⁻</text>
  <text class="role ra" x="92" y="266" text-anchor="middle">CONJUGATE BASE</text>
  <text class="f" x="180" y="250" text-anchor="middle">+</text>
  <rect class="base" x="198" y="206" width="140" height="74" rx="12"/>
  <text class="f" x="268" y="244" text-anchor="middle">H₃O⁺</text>
  <text class="role rb" x="268" y="266" text-anchor="middle">CONJUGATE ACID</text>

  <!-- conjugate pair links -->
  <path class="pair1" d="M14 93 H8 V243 H14"/>
  <path class="pair2" d="M346 93 H352 V243 H346"/>

  <text class="sub" x="180" y="316" text-anchor="middle">Dashed lines join each conjugate pair:</text>
  <text class="sub" x="180" y="334" text-anchor="middle">HCl / Cl⁻ and H₃O⁺ / H₂O differ by one H⁺.</text>
  <text class="sub" x="180" y="360" text-anchor="middle">Colour is a guide only; labels show each role.</text>
</svg>
