<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .box { fill: #f3f1ea; stroke: #c9c5b8; stroke-width: 1.3; }
    .boxa { fill: #e6f4f1; stroke: #0f766e; stroke-width: 1.6; }
    .boxb { fill: #f3effe; stroke: #7c3aed; stroke-width: 1.6; }
    .lab { fill: #14213d; font-size: 12.5px; font-weight: 700; }
    .lab2 { fill: #14213d; font-size: 10.8px; font-weight: 700; }
    .ex { fill: #5b6577; font-size: 10.5px; }
    .line { stroke: #8a94a6; stroke-width: 1.5; fill: none; }
    .q { fill: #b45309; font-size: 10.5px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab, .lab2 { fill: #e9edf5; }
      .sub, .ex { fill: #9aa5ba; }
      .box { fill: #1b263d; stroke: #3a4763; }
      .boxa { fill: #123a3a; stroke: #2dd4bf; }
      .boxb { fill: #2a2347; stroke: #c4b5fd; }
      .line { stroke: #6b7894; }
      .q { fill: #fbbf24; }
    }
    .ring { fill: none; stroke: #c9c5b8; stroke-width: 1.3; }
    .bull { fill: #e6f4f1; stroke: #0f766e; stroke-width: 1.3; }
    .hit { fill: #b45309; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #3a4763; } .bull { fill: #123a3a; stroke: #2dd4bf; } .hit { fill: #fbbf24; } }
  </style>
  <rect class="bg" width="360" height="330" rx="14"/>
  <text class="t" x="20" y="28">Accuracy and precision</text>
  <text class="sub" x="20" y="45">Centre = true value; dots = repeated measurements.</text>
  <circle class="ring" cx="95" cy="105" r="42"/><circle class="ring" cx="95" cy="105" r="30"/><circle class="ring" cx="95" cy="105" r="18"/><circle class="bull" cx="95" cy="105" r="7"/><circle class="hit" cx="96" cy="104" r="3"/><circle class="hit" cx="101" cy="101" r="3"/><circle class="hit" cx="90" cy="110" r="3"/><circle class="hit" cx="100" cy="110" r="3"/><circle class="hit" cx="89" cy="102" r="3"/><text class="lab" x="95" y="167" text-anchor="middle">Accurate and precise</text><text class="ex" x="95" y="181" text-anchor="middle">close together, on target</text>
  <circle class="ring" cx="265" cy="105" r="42"/><circle class="ring" cx="265" cy="105" r="30"/><circle class="ring" cx="265" cy="105" r="18"/><circle class="bull" cx="265" cy="105" r="7"/><circle class="hit" cx="288" cy="84" r="3"/><circle class="hit" cx="293" cy="81" r="3"/><circle class="hit" cx="282" cy="90" r="3"/><circle class="hit" cx="292" cy="90" r="3"/><circle class="hit" cx="281" cy="82" r="3"/><text class="lab" x="265" y="167" text-anchor="middle">Precise, not accurate</text><text class="ex" x="265" y="181" text-anchor="middle">close together, off target</text>
  <circle class="ring" cx="95" cy="245" r="42"/><circle class="ring" cx="95" cy="245" r="30"/><circle class="ring" cx="95" cy="245" r="18"/><circle class="bull" cx="95" cy="245" r="7"/><circle class="hit" cx="71" cy="235" r="3"/><circle class="hit" cx="115" cy="227" r="3"/><circle class="hit" cx="103" cy="269" r="3"/><circle class="hit" cx="81" cy="265" r="3"/><circle class="hit" cx="107" cy="243" r="3"/><text class="lab" x="95" y="307" text-anchor="middle">Accurate, not precise</text><text class="ex" x="95" y="321" text-anchor="middle">spread out, average on target</text>
  <circle class="ring" cx="265" cy="245" r="42"/><circle class="ring" cx="265" cy="245" r="30"/><circle class="ring" cx="265" cy="245" r="18"/><circle class="bull" cx="265" cy="245" r="7"/><circle class="hit" cx="289" cy="219" r="3"/><circle class="hit" cx="259" cy="215" r="3"/><circle class="hit" cx="295" cy="247" r="3"/><circle class="hit" cx="277" cy="237" r="3"/><circle class="hit" cx="263" cy="231" r="3"/><text class="lab" x="265" y="307" text-anchor="middle">Neither</text><text class="ex" x="265" y="321" text-anchor="middle">spread out and off target</text>
</svg>
