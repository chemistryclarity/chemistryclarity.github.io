<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .pt { fill: #14213d; font-size: 12.5px; font-weight: 700; }
    .lab { fill: #14213d; font-size: 11.5px; font-weight: 600; }
    .num { fill: #5b6577; font-size: 9.5px; font-weight: 600; }
    .bp { fill: #b45309; font-size: 11px; font-weight: 700; }
    .chain { stroke: #0f766e; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .branch { stroke: #b45309; stroke-width: 2.6; fill: none; stroke-linecap: round; }
    .cdot { fill: #0f766e; } .bdot { fill: #b45309; }
    .sep { stroke: #e3e7ee; stroke-width: 1; }
    .card { fill: #f6f8fb; stroke: #e3e7ee; stroke-width: 1; }
    .gname { fill: #0f766e; font-size: 12px; font-weight: 700; }
    .atom { fill: #14213d; font-size: 13px; font-weight: 700; }
    .fg { fill: #0f766e; font-size: 13px; font-weight: 700; }
    .bond { stroke: #14213d; stroke-width: 1.6; }
    .fgb { stroke: #0f766e; stroke-width: 1.8; }
    .sfx { fill: #b45309; font-size: 10.5px; font-weight: 700; }
    .ex { fill: #5b6577; font-size: 10px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .pt, .lab, .atom { fill: #e9edf5; } .sub, .num, .ex { fill: #9aa5ba; }
      .chain { stroke: #2dd4bf; } .cdot, .gname, .fg { fill: #2dd4bf; } .fgb { stroke: #2dd4bf; }
      .branch { stroke: #fbbf24; } .bdot, .bp, .sfx { fill: #fbbf24; }
      .sep { stroke: #2a3550; } .card { fill: #1b263d; stroke: #2a3550; } .bond { stroke: #e9edf5; }
    }
  </style>
  <rect class="bg" width="360" height="536" rx="14"/>
  <text class="t" x="20" y="28">Common functional groups</text>
  <text class="sub" x="20" y="45">R and R′ = carbon chains. The group (teal) sets the reactions.</text>
  <rect class="card" x="16" y="62" width="158" height="104" rx="10"/><text class="gname" x="26" y="79">Alcohol</text><line class="bond" x1="59.0" y1="108.0" x2="85.0" y2="108.0"/><line class="fgb" x1="99.0" y1="108.0" x2="123.0" y2="108.0"/><text class="atom" x="52" y="112" text-anchor="middle">R</text><text class="fg" x="92" y="112" text-anchor="middle">O</text><text class="fg" x="130" y="112" text-anchor="middle">H</text><text class="sfx" x="26" y="144">suffix -ol</text><text class="ex" x="26" y="158">ethanol, CH₃CH₂OH</text><rect class="card" x="186" y="62" width="158" height="104" rx="10"/><text class="gname" x="196" y="79">Aldehyde</text><line class="bond" x1="229.0" y1="118.0" x2="253.0" y2="118.0"/><line class="fgb" x1="262.6" y1="109.0" x2="262.6" y2="97.0"/><line class="fgb" x1="257.4" y1="109.0" x2="257.4" y2="97.0"/><line class="fgb" x1="267.0" y1="118.0" x2="291.0" y2="118.0"/><text class="atom" x="222" y="122" text-anchor="middle">R</text><text class="fg" x="260" y="122" text-anchor="middle">C</text><text class="fg" x="260" y="92" text-anchor="middle">O</text><text class="fg" x="298" y="122" text-anchor="middle">H</text><text class="sfx" x="196" y="144">suffix -al</text><text class="ex" x="196" y="158">ethanal, CH₃CHO</text><rect class="card" x="16" y="174" width="158" height="104" rx="10"/><text class="gname" x="26" y="191">Ketone</text><line class="bond" x1="59.0" y1="230.0" x2="83.0" y2="230.0"/><line class="fgb" x1="92.6" y1="221.0" x2="92.6" y2="209.0"/><line class="fgb" x1="87.4" y1="221.0" x2="87.4" y2="209.0"/><line class="bond" x1="97.0" y1="230.0" x2="115.0" y2="230.0"/><text class="atom" x="52" y="234" text-anchor="middle">R</text><text class="fg" x="90" y="234" text-anchor="middle">C</text><text class="fg" x="90" y="204" text-anchor="middle">O</text><text class="atom" x="128" y="234" text-anchor="middle">R′</text><text class="sfx" x="26" y="256">suffix -one</text><text class="ex" x="26" y="270">propanone, CH₃COCH₃</text><rect class="card" x="186" y="174" width="158" height="104" rx="10"/><text class="gname" x="196" y="191">Carboxylic acid</text><line class="bond" x1="223.0" y1="230.0" x2="243.0" y2="230.0"/><line class="fgb" x1="252.6" y1="221.0" x2="252.6" y2="209.0"/><line class="fgb" x1="247.4" y1="221.0" x2="247.4" y2="209.0"/><line class="fgb" x1="257.0" y1="230.0" x2="279.0" y2="230.0"/><line class="fgb" x1="293.0" y1="230.0" x2="311.0" y2="230.0"/><text class="atom" x="216" y="234" text-anchor="middle">R</text><text class="fg" x="250" y="234" text-anchor="middle">C</text><text class="fg" x="250" y="204" text-anchor="middle">O</text><text class="fg" x="286" y="234" text-anchor="middle">O</text><text class="fg" x="318" y="234" text-anchor="middle">H</text><text class="sfx" x="196" y="256">suffix -oic acid</text><text class="ex" x="196" y="270">ethanoic acid, CH₃COOH</text><rect class="card" x="16" y="286" width="158" height="104" rx="10"/><text class="gname" x="26" y="303">Ester</text><line class="bond" x1="53.0" y1="342.0" x2="73.0" y2="342.0"/><line class="fgb" x1="82.6" y1="333.0" x2="82.6" y2="321.0"/><line class="fgb" x1="77.4" y1="333.0" x2="77.4" y2="321.0"/><line class="fgb" x1="87.0" y1="342.0" x2="109.0" y2="342.0"/><line class="bond" x1="123.0" y1="342.0" x2="137.0" y2="342.0"/><text class="atom" x="46" y="346" text-anchor="middle">R</text><text class="fg" x="80" y="346" text-anchor="middle">C</text><text class="fg" x="80" y="316" text-anchor="middle">O</text><text class="fg" x="116" y="346" text-anchor="middle">O</text><text class="atom" x="150" y="346" text-anchor="middle">R′</text><text class="sfx" x="26" y="368">suffix -oate</text><text class="ex" x="26" y="382">ethyl ethanoate, CH₃COOC₂H₅</text><rect class="card" x="186" y="286" width="158" height="104" rx="10"/><text class="gname" x="196" y="303">Amine</text><line class="bond" x1="237.0" y1="332.0" x2="261.0" y2="332.0"/><text class="atom" x="230" y="336" text-anchor="middle">R</text><text class="fg" x="274" y="336" text-anchor="middle">NH₂</text><text class="sfx" x="196" y="368">suffix -amine</text><text class="ex" x="196" y="382">ethanamine, CH₃CH₂NH₂</text><rect class="card" x="16" y="398" width="158" height="104" rx="10"/><text class="gname" x="26" y="415">Haloalkane</text><line class="bond" x1="67.0" y1="444.0" x2="93.0" y2="444.0"/><text class="atom" x="60" y="448" text-anchor="middle">R</text><text class="fg" x="100" y="448" text-anchor="middle">X</text><text class="ex" x="74" y="464" text-anchor="middle">X = F, Cl, Br, I</text><text class="sfx" x="26" y="480">prefix chloro-, bromo-</text><text class="ex" x="26" y="494">chloroethane, CH₃CH₂Cl</text><rect class="card" x="186" y="398" width="158" height="104" rx="10"/><text class="gname" x="196" y="415">Alkene</text><line class="fgb" x1="257.0" y1="446.6" x2="281.0" y2="446.6"/><line class="fgb" x1="257.0" y1="441.4" x2="281.0" y2="441.4"/><line class="bond" x1="243" y1="438" x2="228" y2="428"/><line class="bond" x1="243" y1="450" x2="228" y2="460"/><line class="bond" x1="295" y1="438" x2="310" y2="428"/><line class="bond" x1="295" y1="450" x2="310" y2="460"/><text class="fg" x="250" y="448" text-anchor="middle">C</text><text class="fg" x="288" y="448" text-anchor="middle">C</text><text class="sfx" x="196" y="480">suffix -ene</text><text class="ex" x="196" y="494">ethene, CH₂=CH₂</text>
  <text class="sub" x="20" y="524">Name = chain length (meth-, eth-, prop-, but-…) + suffix.</text>
</svg>
