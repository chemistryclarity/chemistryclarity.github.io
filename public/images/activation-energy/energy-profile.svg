<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .num { fill: #5b6577; font-size: 10px; }
    .al { fill: #14213d; font-size: 11px; font-weight: 600; }
    .grid { stroke: #ece9e1; stroke-width: 1; }
    .axis { stroke: #14213d; stroke-width: 1.3; fill: none; }
    .cA { stroke: #0f766e; stroke-width: 2.6; fill: none; } .lA { fill: #0f766e; font-size: 11.5px; font-weight: 700; }
    .cB { stroke: #b45309; stroke-width: 2.6; fill: none; } .lB { fill: #b45309; font-size: 11.5px; font-weight: 700; }
    .cC { stroke: #7c3aed; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; } .lC { fill: #7c3aed; font-size: 11.5px; font-weight: 700; }
    .guide { stroke: #8a94a6; stroke-width: 1.1; stroke-dasharray: 3 3; fill: none; }
    .dot { fill: #b45309; }
    .arr { stroke: #14213d; stroke-width: 1.4; fill: none; marker-end: url(#hd); marker-start: url(#hs); }
    .hd { fill: #14213d; }
    .ar { fill: #14213d; font-size: 11px; font-weight: 700; }
    .shadeA { fill: #0f766e; opacity: 0.18; } .shadeB { fill: #b45309; opacity: 0.22; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; } .t, .al, .ar { fill: #e9edf5; } .sub, .num { fill: #9aa5ba; }
      .grid { stroke: #27324a; } .axis, .arr { stroke: #e9edf5; } .hd { fill: #e9edf5; }
      .cA { stroke: #2dd4bf; } .lA { fill: #2dd4bf; } .cB { stroke: #fbbf24; } .lB { fill: #fbbf24; } .dot { fill: #fbbf24; }
      .cC { stroke: #c4b5fd; } .lC { fill: #c4b5fd; } .guide { stroke: #6b7894; }
      .shadeA { fill: #2dd4bf; } .shadeB { fill: #fbbf24; }
    }
  </style>
