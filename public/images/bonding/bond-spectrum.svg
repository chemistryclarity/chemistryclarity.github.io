<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .lab { fill: #14213d; font-size: 12px; font-weight: 700; }
    .num { fill: #14213d; font-size: 10.5px; }
    .note { fill: #5b6577; font-size: 10px; }
    .axis { stroke: #14213d; stroke-width: 1.3; fill: none; }
    .bond { stroke: #14213d; stroke-width: 2; fill: none; stroke-linecap: round; }
    .wedge { fill: #14213d; }
    .dash { stroke: #14213d; stroke-width: 2; stroke-dasharray: 2.5 2.5; fill: none; }
    .atom { fill: #14213d; font-size: 15px; font-weight: 700; }
    .atomc { fill: #0f766e; font-size: 16px; font-weight: 700; }
    .dot { fill: #b45309; }
    .lp { fill: #fdf3e3; stroke: #d6a456; stroke-width: 1; }
    .cell { fill: #f8f7f3; stroke: #e2dfd5; stroke-width: 1; }
    .band0 { fill: #e8ebf0; } .band1 { fill: #d5f0ec; } .band2 { fill: #fbe7cf; }
    .mk { fill: #14213d; } .lead { stroke: #8a93a3; stroke-width: 1; stroke-dasharray: 2 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab, .num, .atom { fill: #e9edf5; }
      .sub, .note { fill: #9aa5ba; }
      .axis { stroke: #e9edf5; }
      .bond, .dash { stroke: #e9edf5; } .wedge { fill: #e9edf5; }
      .atomc { fill: #2dd4bf; }
      .dot { fill: #fbbf24; }
      .lp { fill: #3a2f1c; stroke: #b7893d; }
      .cell { fill: #1b263d; stroke: #2c3854; }
      .band0 { fill: #27324a; } .band1 { fill: #134e4a; } .band2 { fill: #4a3415; }
      .mk { fill: #e9edf5; } .lead { stroke: #6b7790; }
    }
  </style>
  <rect class="bg" width="360" height="296" rx="14"/>
  <text class="t" x="20" y="28">Bond type and electronegativity difference</text>
  <text class="sub" x="20" y="45">ΔEN = difference in Pauling electronegativity</text>
  <rect class="band0" x="26" y="92" width="35.2" height="40"/>
  <rect class="band1" x="61.2" y="92" width="123.2" height="40"/>
  <rect class="band2" x="184.4" y="92" width="149.6" height="40"/>
  <text class="lab" x="26" y="78">Nonpolar</text>
  <text class="lab" x="134.8" y="78" text-anchor="middle">Polar covalent</text>
  <text class="lab" x="259.2" y="78" text-anchor="middle">Ionic</text>
  <line class="axis" x1="26" y1="132" x2="334" y2="132"/>
  <line class="axis" x1="26" y1="132" x2="26" y2="137"/><text class="num" x="26" y="149" text-anchor="middle">0.0</text>
  <line class="axis" x1="70" y1="132" x2="70" y2="137"/><text class="num" x="70" y="149" text-anchor="middle">0.5</text>
  <line class="axis" x1="114" y1="132" x2="114" y2="137"/><text class="num" x="114" y="149" text-anchor="middle">1.0</text>
  <line class="axis" x1="158" y1="132" x2="158" y2="137"/><text class="num" x="158" y="149" text-anchor="middle">1.5</text>
  <line class="axis" x1="202" y1="132" x2="202" y2="137"/><text class="num" x="202" y="149" text-anchor="middle">2.0</text>
  <line class="axis" x1="246" y1="132" x2="246" y2="137"/><text class="num" x="246" y="149" text-anchor="middle">2.5</text>
  <line class="axis" x1="290" y1="132" x2="290" y2="137"/><text class="num" x="290" y="149" text-anchor="middle">3.0</text>
  <line class="axis" x1="334" y1="132" x2="334" y2="137"/><text class="num" x="334" y="149" text-anchor="middle">3.5</text>
  <text class="sub" x="180" y="165" text-anchor="middle">ΔEN</text>
  <line class="lead" x1="26" y1="96" x2="26" y2="132"/><line class="lead" x1="26" y1="172" x2="26" y2="181"/><circle class="mk" cx="26" cy="112" r="4.5"/>
  <text class="lab" x="26" y="194" text-anchor="middle">Cl–Cl</text><text class="num" x="26" y="206" text-anchor="middle">0.00</text>
  <line class="lead" x1="56.8" y1="96" x2="56.8" y2="132"/><line class="lead" x1="56.8" y1="172" x2="56.8" y2="211"/><circle class="mk" cx="56.8" cy="112" r="4.5"/>
  <text class="lab" x="56.8" y="224" text-anchor="middle">C–H</text><text class="num" x="56.8" y="236" text-anchor="middle">0.35</text>
  <line class="lead" x1="110.5" y1="96" x2="110.5" y2="132"/><line class="lead" x1="110.5" y1="172" x2="110.5" y2="181"/><circle class="mk" cx="110.5" cy="112" r="4.5"/>
  <text class="lab" x="110.5" y="194" text-anchor="middle">H–Cl</text><text class="num" x="110.5" y="206" text-anchor="middle">0.96</text>
  <line class="lead" x1="135.1" y1="96" x2="135.1" y2="132"/><line class="lead" x1="135.1" y1="172" x2="135.1" y2="211"/><circle class="mk" cx="135.1" cy="112" r="4.5"/>
  <text class="lab" x="135.1" y="224" text-anchor="middle">O–H</text><text class="num" x="135.1" y="236" text-anchor="middle">1.24</text>
  <line class="lead" x1="222.2" y1="96" x2="222.2" y2="132"/><line class="lead" x1="222.2" y1="172" x2="222.2" y2="181"/><circle class="mk" cx="222.2" cy="112" r="4.5"/>
  <text class="lab" x="222.2" y="194" text-anchor="middle">Na–Cl</text><text class="num" x="222.2" y="206" text-anchor="middle">2.23</text>
  <line class="lead" x1="294.4" y1="96" x2="294.4" y2="132"/><line class="lead" x1="294.4" y1="172" x2="294.4" y2="211"/><circle class="mk" cx="294.4" cy="112" r="4.5"/>
  <text class="lab" x="294.4" y="224" text-anchor="middle">Na–F</text><text class="num" x="294.4" y="236" text-anchor="middle">3.05</text>
  <text class="note" x="20" y="268">The cut-offs (about 0.4 and 1.8) are approximate and vary</text>
  <text class="note" x="20" y="281">between textbooks: bond character changes gradually.</text>
</svg>
