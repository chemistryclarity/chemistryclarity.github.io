<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #14213d; font-size: 14px; font-weight: 700; }
    .sub { fill: #5b6577; font-size: 11px; }
    .ax { stroke: #3d4657; stroke-width: 1.4; fill: none; }
    .pk { stroke: #0f766e; stroke-width: 2.4; }
    .tms { stroke: #8a94a6; stroke-width: 2; }
    .tick { fill: #5b6577; font-size: 10px; }
    .lab { fill: #14213d; font-size: 10.5px; font-weight: 800; }
    .ex { fill: #5b6577; font-size: 9.5px; }
    .int { fill: #7c3aed; font-size: 9.5px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151e31; }
      .t, .lab { fill: #e9edf5; }
      .sub, .tick, .ex { fill: #9aa5ba; }
      .ax { stroke: #c7cfdd; }
      .pk { stroke: #2dd4bf; }
      .tms { stroke: #6b7894; }
      .int { fill: #c4b5fd; }
    }
  </style>
  <rect class="bg" width="360" height="260" rx="14"/>
  <text class="t" x="16" y="28">¹H NMR spectrum of ethanol, CH₃CH₂OH</text>
  <text class="sub" x="16" y="45">Schematic: three environments, areas 2 : 1 : 3</text>
  <text class="lab" x="116.0" y="72" text-anchor="middle">CH₂</text><text class="ex" x="116.0" y="84" text-anchor="middle">quartet, 3.7</text><text class="int" x="116.0" y="96" text-anchor="middle">area 2</text>
  <text class="lab" x="179.2" y="72" text-anchor="middle">OH</text><text class="ex" x="179.2" y="84" text-anchor="middle">singlet, ~2.6</text><text class="int" x="179.2" y="96" text-anchor="middle">area 1</text>
  <text class="lab" x="259.2" y="72" text-anchor="middle">CH₃</text><text class="ex" x="259.2" y="84" text-anchor="middle">triplet, 1.2</text><text class="int" x="259.2" y="96" text-anchor="middle">area 3</text>
  <line class="pk" x1="108.5" y1="200" x2="108.5" y2="178.0"/><line class="pk" x1="113.5" y1="200" x2="113.5" y2="134.0"/><line class="pk" x1="118.5" y1="200" x2="118.5" y2="134.0"/><line class="pk" x1="123.5" y1="200" x2="123.5" y2="178.0"/><line class="pk" x1="179.2" y1="200" x2="179.2" y2="160.0"/><line class="pk" x1="254.2" y1="200" x2="254.2" y2="160.0"/><line class="pk" x1="259.2" y1="200" x2="259.2" y2="120.0"/><line class="pk" x1="264.2" y1="200" x2="264.2" y2="160.0"/><line class="tms" x1="330" y1="200" x2="330" y2="170"/>
  <text class="ex" x="330" y="166" text-anchor="middle">TMS</text>
  <path class="ax" d="M36 200 H334"/>
  <line class="ax" x1="40" y1="200" x2="40" y2="204"/><text class="tick" x="40" y="216" text-anchor="middle">5</text><line class="ax" x1="98" y1="200" x2="98" y2="204"/><text class="tick" x="98" y="216" text-anchor="middle">4</text><line class="ax" x1="156" y1="200" x2="156" y2="204"/><text class="tick" x="156" y="216" text-anchor="middle">3</text><line class="ax" x1="214" y1="200" x2="214" y2="204"/><text class="tick" x="214" y="216" text-anchor="middle">2</text><line class="ax" x1="272" y1="200" x2="272" y2="204"/><text class="tick" x="272" y="216" text-anchor="middle">1</text><line class="ax" x1="330" y1="200" x2="330" y2="204"/><text class="tick" x="330" y="216" text-anchor="middle">0</text>
  <text class="tick" x="186" y="232" text-anchor="middle">chemical shift, δ (ppm) ← decreasing</text>
  <text class="ex" x="16" y="250">CH₂ is next to O, so higher δ. CH₂ split by 3 H; CH₃ by 2 H.</text>
</svg>
