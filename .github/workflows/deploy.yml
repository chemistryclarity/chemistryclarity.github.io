# Builds the website and publishes it to GitHub Pages
# every time changes are pushed to the `main` branch.
# If the build fails (for example, a content file has a mistake),
# the live site is NOT changed — fix the error and push again.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the site, creates the worksheet/notes PDFs and preview images
      # (using the Chrome browser that GitHub's build servers include), then builds and checks again.
      - name: Build the website and PDFs
        run: npm run pdfs

      - name: Package the website for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
